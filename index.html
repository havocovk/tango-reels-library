<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tango Reels Library</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="bg-glow current-location-glow"></div>
    <div class="bg-glow secondary-glow"></div>

    <div class="app-container">
        <aside class="sidebar-glass">
            <div class="sidebar-header">
                <h2>Tango Library</h2>
                <button id="lang-toggle-btn" class="lang-btn">🇬🇧 EN</button>
            </div>
            <hr>
            <div class="menu-items">
                <button class="menu-btn active" id="menu-library">📚 Kütüphane</button>
                <button class="menu-btn" id="menu-add-video">➕ Yeni Video Ekle</button>
            </div>
        </aside>

        <main class="main-content-glass">
            
            <div id="view-library-container">
                <div class="search-bar">
                    <input type="text" id="search-input" placeholder="Eğitmen, hareket veya etiket ara...">
                    <button id="filter-btn" class="filter-btn">🔍 Filtrele</button>
                </div>
                <div class="video-grid" id="video-grid">
                    <div class="info-msg" id="loading-msg">Veritabanı bağlantısı kuruluyor...</div>
                </div>
            </div>

            <div id="view-add-container" class="d-none">
                <h2 id="form-title" style="margin-bottom: 20px; color: #38bdf8;">➕ Yeni Video Kaydet</h2>
                
                <form id="add-video-form">
                    <div class="form-group">
                        <label id="lbl-instructor">Eğitmen Seç / Ekle:</label>
                        <div class="instructor-select-box" style="display: flex; gap: 10px;">
                            <select id="form-instructor-select" style="flex: 1;">
                                </select>
                            <button type="button" id="btn-toggle-new-instructor" class="action-btn">➕</button>
                            <button type="button" id="btn-edit-instructor" class="action-btn">📝</button>
                            <button type="button" id="btn-delete-instructor" class="action-btn delete-btn">❌</button>
                        </div>
                    </div>

                    <div id="new-instructor-container" class="form-group d-none" style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; border: 1px dashed rgba(255,255,255,0.1);">
                        <label id="lbl-new-instructor-name">Eğitmen Adı:</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="text" id="form-new-instructor-input" placeholder="Örn: Juan D'Arienzo">
                            <button type="button" id="btn-save-instructor" class="submit-btn" style="width: auto; padding: 0 20px;">Ekle</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label id="lbl-video-url">Video URL (Instagram, YouTube, Drive vb.):</label>
                        <input type="url" id="form-video-url" placeholder="https://..." required>
                    </div>

                    <div class="form-group">
                        <label id="lbl-cover-url">Kapak Resmi URL (Sadece IG / FB Ekran Görüntüsü):</label>
                        <input type="url" id="form-cover-url" placeholder="https://.../resim.jpg">
                    </div>

                    <div class="form-group">
                        <label id="lbl-role">Rol Tipi:</label>
                        <select id="form-role-select">
                            <option value="Both">Leader & Follower (Both)</option>
                            <option value="Leader">Leader</option>
                            <option value="Follower">Follower</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label id="lbl-partner">Partner Adı (İsteğe Bağlı):</label>
                        <input type="text" id="form-partner-name" placeholder="Partner...">
                    </div>

                    <div class="form-group row-group">
                        <input type="checkbox" id="form-is-downloaded">
                        <label id="lbl-downloaded" for="form-is-downloaded" style="cursor:pointer;">Google Drive'a Yedeklendi mi?</label>
                    </div>

                    <button type="submit" id="btn-submit-video" class="submit-btn">💾 Veritabanına Kaydet</button>
                </form>
            </div>

        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
