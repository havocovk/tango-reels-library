<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arjantin Tango Kombinasyon Kütüphanesi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-glow current-location-glow"></div>
    <div class="secondary-glow bg-glow"></div>

    <div class="app-container">
        
        <nav class="sidebar-glass">
            <div class="sidebar-header">
                <h2 id="sidebar-title">💃 ATKK</h2>
                <button id="lang-toggle-btn" class="lang-btn">🇬🇧 EN</button>
            </div>
            <hr style="border-color: rgba(255,255,255,0.1); margin: 15px 0;\">
            <div class="menu-items">
                <button id="menu-library" class="menu-btn active">📚 Kütüphane</button>
                <button id="menu-favorites" class="menu-btn">⭐ Pratik Listem</button>
                <button id="menu-add-video" class="menu-btn">➕ Yeni Video Ekle</button>
            </div>
        </nav>

        <main class="main-content">
            <header class="content-header">
                <h1 id="main-title">Arjantin Tango Kombinasyon Kütüphanesi</h1>
            </header>

            <div id="search-filter-section" class="search-filter-bar">
                <div class="search-wrapper">
                    <input type="text" id="search-input" placeholder="Eğitmen, partner veya etiket (tag) ara...">
                </div>
                <div class="filters-group">
                    <select id="filter-role-select" class="filter-select">
                        <option value="ALL" id="opt-all-roles">Tüm Roller</option>
                        <option value="LEADER" id="opt-leader">Lider</option>
                        <option value="FOLLOWER" id="opt-follower">Takipçi</option>
                        <option value="BOTH" id="opt-both">İkisi de</option>
                    </select>
                    <select id="filter-location-select" class="filter-select">
                        <option value="ALL" id="opt-all-locations">Tüm Ortamlar</option>
                        <option value="DRIVE" id="opt-drive">💾 Google Drive</option>
                        <option value="SOCIAL" id="opt-social">🌐 Sosyal Medya</option>
                    </select>
                    <button id="filter-btn" class="filter-btn-action">🔍 Filtrele</button>
                </div>
            </div>

            <div id="action-bar" class="action-bar d-none">
                <button id="clear-favorites-btn" class="clear-fav-btn">🗑️ Bu Haftaki Pratik Listesini Temizle</button>
            </div>

            <div id="loading-element" class="loading-text">Veritabanı bağlantısı kuruluyor......</div>
            <div id="empty-element" class="empty-text d-none"></div>

            <div id="video-grid" class="video-grid"></div>

            <div id="form-section" class="form-container d-none">
                <h2 id="form-title">➕ Yeni Video Kaydet...</h2>
                <form id="add-video-form">
                    <div class="form-group">
                        <label for="video-url" id="lbl-video-link">Video Linki (Drive / Instagram / Facebook):</label>
                        <input type="url" id="video-url" required>
                    </div>
                    <div class="form-group">
                        <label for="partner-name" id="lbl-partner">Partner Adı:</label>
                        <input type="text" id="partner-name">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="role-select" id="lbl-role">Rol Seçimi:</label>
                            <select id="role-select">
                                <option value="LEADER">Lider</option>
                                <option value="FOLLOWER">Takipçi</option>
                                <option value="BOTH">İkisi de</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="location-select" id="lbl-location">Ortam Seçimi:</label>
                            <select id="location-select">
                                <option value="DRIVE">💾 Google Drive</option>
                                <option value="SOCIAL">🌐 Sosyal Medya</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="instructor-select" id="lbl-instructor">Eğitmen Seçimi:</label>
                        <div style="display: flex; gap: 10px;">
                            <select id="instructor-select" style="flex: 1;"></select>
                            <button type="button" id="btn-toggle-instructor-input" class="secondary-btn">➕ Yeni Eğitmen Ekle</button>
                        </div>
                    </div>
                    
                    <div id="new-instructor-container" class="form-group d-none" style="background: rgba(255,255,255,0.02); padding: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05);">
                        <label for="new-instructor-name" id="lbl-new-instructor-name">Eğitmen Adı:</label>
                        <input type="text" id="new-instructor-name" style="margin-bottom: 10px;">
                        <div style="display: flex; gap: 10px;">
                            <button type="button" id="btn-save-instructor" class="filter-btn-action" style="padding: 8px 16px;">Ekle</button>
                            <button type="button" id="btn-delete-instructor" class="clear-fav-btn" style="padding: 8px 16px; margin:0;">Sil</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label id="lbl-cover-upload">Kapak Resmi:</label>
                        <div id="drop-area" class="drop-zone">
                            <p id="drop-area-text">📸 Buraya tıklayın ve Ctrl + V ile ekran görüntüsü yapıştırın</p>
                            <img id="image-preview" src="" alt="Önizleme" class="d-none" style="max-width: 100%; max-height: 200px; border-radius: 8px; margin-top: 10px;">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Etiketler (Tags):</label>
                        <div class="tags-input-container" id="form-tags-wrapper">
                            <div id="form-chips-area" style="display: inline-flex; flex-wrap: wrap; gap: 6px;"></div>
                            <div class="autocomplete-wrapper" style="flex: 1; min-width: 150px; position: relative;">
                                <input type="text" id="video-tags-input" placeholder="Yeni etiket yazıp virgül koyun...">
                                <div id="form-autocomplete-list" class=\"autocomplete-suggestions d-none\"></div>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="submit-btn" id="btn-submit-form">Kaydet</button>
                </form>
            </div>
        </main>
    </div>

    <div id="video-modal" class="modal-overlay d-none">
        <div class="modal-content">
            <span id="modal-close-btn" class="modal-close">&times;</span>
            <div class="video-container">
                <iframe id="modal-iframe" src="" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <div id="tags-edit-modal" class="modal-overlay d-none">
        <div class="modal-content" style="max-width: 500px; padding: 25px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px);">
            <span id="tags-modal-close-btn" class="modal-close" style="top: 15px; right: 20px;">&times;</span>
            <h3 id="edit-tags-title" style="color: #fff; margin-bottom: 20px; font-weight: 600;">✏️ Etiketleri Düzenle</h3>
            
            <div id="modal-tags-list-container" class="modal-tags-list"></div>
            
            <hr style="border-color: rgba(255,255,255,0.1); margin: 20px 0;">
            
            <div class="form-group">
                <div class="tags-input-container" id="modal-tags-wrapper">
                    <div id="modal-chips-area" style="display: inline-flex; flex-wrap: wrap; gap: 6px;"></div>
                    <div class="autocomplete-wrapper" style="flex: 1; min-width: 150px; position: relative;">
                        <input type="text" id="modal-tags-input" placeholder="Yeni etiket yazıp virgül koyun...">
                        <div id="modal-autocomplete-list" class="autocomplete-suggestions d-none"></div>
                    </div>
                </div>
            </div>
            <button id="btn-save-tags-modal" class="submit-btn" style="margin-top: 15px;">Kapat</button>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
