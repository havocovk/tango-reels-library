<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arjantin Tango Kombinasyon Kütüphanesi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-glow current-location-glow"></div>
    <div class="secondary-glow bg-glow"></div>

    <div class="app-container">
        
        <nav class="sidebar-glass">
            <div class="sidebar-header">
                <h2 id="sidebar-title">💃 ATKK</h2>
                <button id="lang-toggle-btn" class="lang-btn">🇬🇧 EN</button>
            </div>
            <hr style="border-color: rgba(255,255,255,0.1); margin: 15px 0;">
            <div class="menu-items">
                <button id="menu-library" class="menu-btn active">📚 Kütüphane</button>
                <button id="menu-favorites" class="menu-btn">⭐ Pratik Listem</button>
                <button id="menu-add-video" class="menu-btn">➕ Yeni Video Ekle</button>
            </div>
        </nav>

        <main class="content-area">
            
            <div id="library-view" class="view-section">
                <div class="filter-bar-glass">
                    <div class="search-box">
                        <input type="text" id="search-input" placeholder="Eğitmen, partner veya etiket (tag) ara...">
                    </div>
                    <div class="filter-dropdowns">
                        <div class="select-wrapper">
                            <select id="filter-role-select">
                                <option value="all">Tüm Roller</option>
                                <option value="Leader">Leader</option>
                                <option value="Follower">Follower</option>
                                <option value="Both">Both</option>
                            </select>
                        </div>
                        <div class="select-wrapper">
                            <select id="filter-location-select">
                                <option value="all">Tüm Ortamlar</option>
                                <option value="Google Drive">💾 Google Drive</option>
                                <option value="Sosyal Medya">🌐 Sosyal Medya</option>
                            </select>
                        </div>
                        <button id="filter-btn" class="filter-submit-btn">🔍 Filtrele</button>
                    </div>
                </div>

                <div id="video-grid" class="video-grid-layout">
                    </div>
            </div>

            <div id="add-video-view" class="view-section d-none">
                <div class="form-container-glass">
                    <h3 id="form-title" class="form-section-title">➕ Yeni Video Kaydet</h3>
                    <form id="add-video-form">
                        
                        <div class="form-grid">
                            <div class="form-group">
                                <label id="lbl-instructor" for="instructor-select">Eğitmen Seçimi:</label>
                                <div style="display: flex; gap: 10px; align-items: center;">
                                    <div class="select-wrapper" style="flex: 1;">
                                        <select id="instructor-select" required>
                                            <option value="">Seçiniz...</option>
                                        </select>
                                    </div>
                                    <button type="button" id="btn-open-instructor-manager" class="card-crud-btn" style="padding: 12px; white-space: nowrap;">⚙️ Eğitmenleri Yönet</button>
                                </div>
                            </div>

                            <div class="form-group">
                                <label id="lbl-partner" for="partner-input">Partner (Opsiyonel):</label>
                                <input type="text" id="partner-input" placeholder="Örn: Maria">
                            </div>
                        </div>

                        <div class="form-group">
                            <label id="lbl-video-url" for="video-url-input">Video URL (Drive veya Sosyal Medya):</label>
                            <input type="url" id="video-url-input" required placeholder="https://drive.google.com/... veya sosyal medya linki">
                        </div>

                        <div class="form-grid">
                            <div class="form-group">
                                <label id="lbl-role" for="role-select">Rolü Seçin:</label>
                                <div class="select-wrapper">
                                    <select id="role-select" required>
                                        <option value="Leader">Leader</option>
                                        <option value="Follower">Follower</option>
                                        <option value="Both">Both</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-group">
                                <label id="lbl-location" for="location-select">Ortamı Seçin:</label>
                                <div class="select-wrapper">
                                    <select id="location-select" required>
                                        <option value="Google Drive">💾 Google Drive</option>
                                        <option value="Sosyal Medya">🌐 Sosyal Medya</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label id="lbl-tags" for="form-tags-input">Etiketler (Tag'ler):</label>
                            <div class="tags-input-container" id="form-tags-wrapper">
                                <div id="form-chips-area" style="display: inline-flex; flex-wrap: wrap; gap: 6px;"></div>
                                <div class="autocomplete-wrapper" style="flex: 1; min-width: 150px; position: relative;">
                                    <input type="text" id="form-tags-input" placeholder="Etiket yazıp enter veya virgüle basın...">
                                    <div id="form-autocomplete-list" class="autocomplete-suggestions d-none"></div>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label id="lbl-cover-upload">Kapak Görseli:</label>
                            <div id="drop-area" class="screenshot-drop-zone">
                                <p id="drop-area-text">📸 Buraya tıklayın ve Ctrl + V ile ekran görüntüsü yapıştırın</p>
                                <img id="image-preview" src="" alt="Önizleme" class="d-none">
                            </div>
                        </div>

                        <button type="submit" id="btn-submit-video" class="watch-link-btn" style="width: 100%; padding: 14px; font-size: 1rem; margin-top: 10px;">💾 Videoyu Kütüphaneye Ekle</button>
                    </form>
                </div>
            </div>

        </main>
    </div>

    <div id="video-modal" class="modal-overlay d-none">
        <div class="modal-content">
            <span id="modal-close-btn" class="modal-close">&times;</span>
            <div class="iframe-container">
                <iframe id="modal-iframe" src="" allow="autoplay" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <div id="instructor-modal" class="modal-overlay d-none">
        <div class="modal-content" style="max-width: 500px; padding: 25px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px);">
            <span id="instructor-modal-close-btn" class="modal-close" style="top: 15px; right: 20px;">&times;</span>
            <h3 id="modal-ins-title" style="color: #fff; margin-bottom: 20px; font-weight: 600;">⚙️ Eğitmen Yönetim Paneli</h3>
            
            <div class="form-group">
                <label id="lbl-select-instructor" for="modal-instructor-select">Mevcut Eğitmeni Düzenle / Sil:</label>
                <div style="display: flex; gap: 10px;">
                    <div class="select-wrapper" style="flex: 1;">
                        <select id="modal-instructor-select">
                            <option value="">Seçiniz...</option>
                        </select>
                    </div>
                    <button type="button" id="btn-edit-instructor-name" class="card-crud-btn">✏️ İsmi Düzenle</button>
                    <button type="button" id="btn-delete-instructor" class="card-crud-btn" style="color: #ef4444; border-color: rgba(239,68,68,0.2);">🗑️</button>
                </div>
            </div>

            <hr style="border-color: rgba(255,255,255,0.1); margin: 20px 0;">

            <div class="form-group">
                <label id="lbl-new-instructor-name" for="new-instructor-name-input">Eğitmen Adı:</label>
                <input type="text" id="new-instructor-name-input" placeholder="Yeni eğitmen adı yazın...">
            </div>

            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
                <button type="button" id="btn-cancel-instructor" class="card-crud-btn" style="padding: 10px 20px;">İptal</button>
                <button type="button" id="btn-save-instructor" class="watch-link-btn" style="padding: 10px 25px;">Ekle</button>
            </div>
        </div>
    </div>

    <div id="tags-edit-modal" class="modal-overlay d-none">
        <div class="modal-content" style="max-width: 500px; padding: 25px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px);">
            <span id="tags-modal-close-btn" class="modal-close" style="top: 15px; right: 20px;">&times;</span>
            <h3 id="edit-tags-title" style="color: #fff; margin-bottom: 20px; font-weight: 600;">✏️ Etiketleri Düzenle</h3>
            
            <div id="modal-tags-list-container" class="modal-tags-list"></div>
            
            <hr style="border-color: rgba(255,255,255,0.1); margin: 20px 0;">
            
            <div class="form-group">
                <div class="tags-input-container" id="modal-tags-wrapper">
                    <div id="modal-chips-area" style="display: inline-flex; flex-wrap: wrap; gap: 6px;"></div>
                    <div class="autocomplete-wrapper" style="flex: 1; min-width: 150px; position: relative;">
                        <input type="text" id="modal-tags-input" placeholder="Yeni etiket yazıp virgül koyun...">
                        <div id="modal-autocomplete-list" class="autocomplete-suggestions d-none"></div>
                    </div>
                </div>
            </div>

            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
                <button type="button" id="tags-modal-close-btn-footer" class="card-crud-btn" onclick="closeTagsEditModal()" style="padding: 10px 20px;">İptal</button>
                <button type="button" id="btn-save-modal-tags" class="watch-link-btn" style="padding: 10px 25px;">Kaydet</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
