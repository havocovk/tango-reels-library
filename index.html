<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arjantin Tango Kombinasyon Kütüphanesi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-glow current-location-glow"></div>
    <div class="secondary-glow bg-glow"></div>

    <div class="app-container">
        
        <nav class="sidebar-glass">
            <div class="sidebar-header">
                <h2 id="sidebar-title">💃 ATKK</h2>
                <button id="lang-toggle-btn" class="lang-btn">🇬🇧 EN</button>
            </div>
            <hr style="border-color: rgba(255,255,255,0.1); margin: 15px 0;">
            <div class="menu-items">
                <button id="menu-library" class="menu-btn active">📚 Kütüphane</button>
                <button id="menu-favorites" class="menu-btn">⭐ Pratik Listemiz</button>
                <button id="menu-add-video" class="menu-btn">➕ Yeni Video Ekle</button>
            </div>
        </nav>

        <main class="content-area">
            <h1 id="main-title" class="page-title">Arjantin Tango Kombinasyon Kütüphanesi</h1>

            <div id="view-library" class="view-section">
                <div class="filter-bar-glass">
                    <div class="search-box">
                        <input type="text" id="search-input" placeholder="Eğitmen, partner veya etiket (tag) ara...">
                    </div>
                    <div class="filter-actions">
                        <select id="filter-role-select" class="filter-select">
                            <option value="all">🎬 Tüm Roller</option>
                            <option value="Leader">Leader</option>
                            <option value="Follower">Follower</option>
                            <option value="Both">Both</option>
                        </select>
                        <select id="filter-location-select" class="filter-select">
                            <option value="all">📍 Tüm Ortamlar</option>
                            <option value="Google Drive">💾 Google Drive</option>
                            <option value="Social Media">🌐 Sosyal Medya</option>
                        </select>
                        <button id="filter-btn" class="action-btn">🔍 Filtrele</button>
                    </div>
                </div>

                <div class="bulk-action-container d-none" id="bulk-action-area">
                    <button id="btn-clear-all-favs" class="clear-favs-btn">🗑️ Bu Haftaki Pratik Listesini Temizle</button>
                </div>

                <div id="loading-indicator" class="status-message">Veritabanı bağlantısı kuruluyor......</div>
                <div id="videos-grid" class="cards-grid"></div>
            </div>

            <div id="view-add-video" class="view-section d-none">
                <div class="form-container-glass">
                    <h2 id="form-heading">➕ Yeni Video Kaydet</h2>
                    <form id="add-video-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="video-url">Video URL *</label>
                                <input type="url" id="video-url" required placeholder="https://drive.google.com/... veya sosyal medya linki">
                            </div>
                            <div class="form-group">
                                <label for="filter-location">Ortam *</label>
                                <select id="filter-location" required>
                                    <option value="Google Drive">💾 Google Drive</option>
                                    <option value="Social Media">🌐 Sosyal Medya</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="instructor-select">Eğitmen *</label>
                                <div style="display: flex; gap: 10px;">
                                    <select id="instructor-select" style="flex: 1;" required>
                                        <option value="">-- Eğitmen Seçin --</option>
                                    </select>
                                    <button type="button" id="btn-manage-instructors" class="manage-btn">⚙️</button>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="partner-input">Partner / Dansçı</label>
                                <input type="text" id="partner-input" placeholder="Partner adını yazın">
                            </div>
                        </div>

                        <div id="new-instructor-container" class="instructor-manager-panel d-none">
                            <div class="ins-manager-title">👤 Eğitmen Yönetimi</div>
                            <div class="form-row" style="align-items: flex-end; margin-bottom: 0;">
                                <div class="form-group" style="margin-bottom: 0;">
                                    <label id="lbl-new-instructor-name" for="new-instructor-name">Eğitmen Adı:</label>
                                    <input type="text" id="new-instructor-name" placeholder="Yeni veya düzenlenecek eğitmen">
                                </div>
                                <div class="ins-manager-buttons">
                                    <button type="button" id="btn-save-instructor" class="ins-btn save">Ekle</button>
                                    <button type="button" id="btn-delete-instructor" class="ins-btn delete d-none">🗑️ Sil</button>
                                </div>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="filter-role">Rol *</label>
                                <select id="filter-role" required>
                                    <option value="Leader">Leader</option>
                                    <option value="Follower">Follower</option>
                                    <option value="Both">Both</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Etiketler (Tag Chips)</label>
                                <div class="tags-input-container" id="form-tags-wrapper">
                                    <div id="form-chips-area" style="display: inline-flex; flex-wrap: wrap; gap: 6px;"></div>
                                    <input type="text" id="tags-input" placeholder="Yazıp Enter veya Virgül'e basın..." style="flex: 1; min-width: 120px; border: none; padding: 4px; background: transparent; color: white; outline: none;">
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label id="lbl-cover-upload">Kapak Görseli:</label>
                            <div id="drop-area" class="upload-drop-zone">
                                <p id="drop-area-text">📸 Buraya tıklayın ve Ctrl + V ile ekran görüntüsünü yapıştırın</p>
                                <img id="image-preview" src="" alt="Önizleme" class="d-none">
                            </div>
                        </div>

                        <button type="submit" id="btn-submit-video" class="submit-btn">💾 Kütüphaneye Kaydet</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <div id="video-modal" class="modal-overlay d-none">
        <div class="modal-content">
            <span id="modal-close-btn" class="modal-close">&times;</span>
            <div class="iframe-container">
                <iframe id="modal-iframe" src="" allow="autoplay" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <div id="tags-edit-modal" class="modal-overlay d-none">
        <div class="modal-content" style="max-width: 500px; padding: 25px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px);">
            <span id="tags-modal-close-btn" class="modal-close" style="top: 15px; right: 20px;">&times;</span>
            <h3 id="edit-tags-title" style="color: #fff; margin-bottom: 20px; font-weight: 600;">✏️ Etiketleri Düzenle</h3>
            
            <div id="modal-tags-list-container" class="modal-tags-list"></div>
            
            <hr style="border-color: rgba(255,255,255,0.1); margin: 20px 0;">
            
            <div class="form-group">
                <div class="tags-input-container" id="modal-tags-wrapper">
                    <div id="modal-chips-area" style="display: inline-flex; flex-wrap: wrap; gap: 6px;"></div>
                    <div class="autocomplete-wrapper" style="flex: 1; min-width: 150px; position: relative;">
                        <input type="text" id="modal-tags-input" placeholder="Yeni etiket yazıp virgül koyun...">
                    </div>
                </div>
            </div>
            <button type="button" id="btn-save-tags-modal" class="submit-btn" style="margin-top: 15px;">💾 Etiketleri Güncelle</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
