<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arjantin Tango Kombinasyon Kütüphanesi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-glow current-location-glow"></div>
    <div class="secondary-glow bg-glow"></div>

    <div class="app-container">
        
        <nav class="sidebar-glass">
            <div class="sidebar-header">
                <h2 id="sidebar-title">💃 ATKK</h2>
                <button id="lang-toggle-btn" class="lang-btn">🇬🇧 EN</button>
            </div>
            <hr style="border-color: rgba(255,255,255,0.1); margin: 15px 0;">
            <div class="menu-items">
                <button id="menu-library" class="menu-btn active">📚 Kütüphane</button>
                <button id="menu-favorites" class="menu-btn">⭐ Pratik Listem</button>
                <button id="menu-add-video" class="menu-btn">➕ Yeni Video Ekle</button>
            </div>
        </nav>

        <main class="main-content">
            <div class="search-filter-bar">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Eğitmen, partner veya etiket (tag) ara...">
                </div>
                <div class="filter-options">
                    <select id="filter-role-select" class="filter-select">
                        <option value="all">🎬 Rol</option>
                        <option value="Leader">Leader</option>
                        <option value="Follower">Follower</option>
                        <option value="Both">Both</option>
                    </select>
                    <select id="filter-location-select" class="filter-select">
                        <option value="all">📍 Ortam</option>
                        <option value="Google Drive">💾 Google Drive</option>
                        <option value="Social Media">🌐 Social Media</option>
                    </select>
                    <button id="filter-btn" class="action-btn">🔍 Filtrele</button>
                </div>
            </div>

            <section id="library-view" class="view-section">
                <div id="video-grid" class="video-grid">
                    <div class="loading-text" id="loading-message">Veritabanı bağlantısı kuruluyor......</div>
                </div>
            </section>

            <section id="add-video-view" class="view-section d-none">
                <div class="form-card-glass">
                    <h3 id="form-title">➕ Yeni Video Kaydet</h3>
                    <form id="add-video-form">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="instructor-select" id="lblInstructor">Eğitmen:</label>
                                <div style="display: flex; gap: 10px;">
                                    <select id="instructor-select" required>
                                        <option value="">Seçiniz...</option>
                                    </select>
                                    <button type="button" id="btn-open-instructor-manager" class="icon-btn-edit">⚙️</button>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="partner-input" id="lblPartner">Partner / Asistan:</label>
                                <input type="text" id="partner-input" placeholder="Partner adı...">
                            </div>
                            <div class="form-group">
                                <label for="video-url-input" id="lblVideoUrl">Video Linki (Drive / Sosyal Medya):</label>
                                <input type="url" id="video-url-input" placeholder="https://..." required>
                            </div>
                            <div class="form-group">
                                <label for="role-select" id="lblRole">Rol:</label>
                                <select id="role-select" required>
                                    <option value="Leader">Leader</option>
                                    <option value="Follower">Follower</option>
                                    <option value="Both">Both</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="location-select" id="lblLocation">Ortam:</label>
                                <select id="location-select" required>
                                    <option value="Google Drive">Google Drive</option>
                                    <option value="Social Media">Social Media</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label id="lblCoverUpload">Kapak Görseli:</label>
                                <div id="drop-area" class="drop-zone">
                                    <span id="drop-area-text">📸 Buraya tıklayıp Ctrl + V ile ekran görüntüsü yapıştırın</span>
                                    <img id="image-preview" class="d-none" alt="Kapak Önizleme">
                                </div>
                            </div>
                        </div>

                        <div class="form-group" style="margin-top: 20px;">
                            <label id="lblTags">Etiketler (Virgül ile ayırın veya enter'a basın):</label>
                            <div class="tags-input-container" id="form-tags-wrapper">
                                <div id="form-chips-area" style="display: inline-flex; flex-wrap: wrap; gap: 6px;"></div>
                                <div class="autocomplete-wrapper" style="flex: 1; min-width: 150px; position: relative;">
                                    <input type="text" id="form-tags-input" placeholder="Örn: Sacada, Giro, Volcada...">
                                    <div id="form-autocomplete-list" class="autocomplete-suggestions d-none"></div>
                                </div>
                            </div>
                        </div>

                        <button type="submit" id="btn-submit-video" class="submit-btn" style="margin-top: 20px;">💾 Kombinasyonu Kütüphaneye Ekle</button>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <div id="video-modal" class="modal-overlay d-none">
        <div class="modal-content">
            <span id="modal-close-btn" class="modal-close">&times;</span>
            <div class="iframe-container">
                <iframe id="modal-iframe" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <div id="instructor-modal" class="modal-overlay d-none">
        <div class="modal-content" style="max-width: 500px; padding: 25px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px);">
            <span id="instructor-modal-close-btn" class="modal-close" style="top: 15px; right: 20px;">&times;</span>
            <h3 id="ins-modal-title" style="color: #fff; margin-bottom: 20px; font-weight: 600;">⚙️ Eğitmen Yönetimi</h3>
            
            <div class="form-group" style="margin-bottom: 15px;">
                <label for="modal-instructor-select" style="color: rgba(255,255,255,0.7); font-size: 0.85rem; margin-bottom: 6px; display: block;">Mevcut Eğitmenler:</label>
                <div style="display: flex; gap: 10px;">
                    <select id="modal-instructor-select" style="flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 10px; border-radius: 8px;">
                        <option value="">Seçiniz...</option>
                    </select>
                    <button type="button" id="btn-edit-instructor-name" class="card-crud-btn" style="padding: 0 15px;">✏️</button>
                    <button type="button" id="btn-delete-instructor" class="card-crud-btn" style="padding: 0 15px; color: #ef4444;">🗑️</button>
                </div>
            </div>

            <div id="new-instructor-container" class="form-group d-none" style="margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1);">
                <label id="lblNewInstructorName" for="new-instructor-name-input" style="color: rgba(255,255,255,0.7); font-size: 0.85rem; margin-bottom: 6px; display: block;">Eğitmen Adı:</label>
                <input type="text" id="new-instructor-name-input" placeholder="Eğitmen ismi yazın..." style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 10px; border-radius: 8px; width: 100%; margin-bottom: 15px;">
                <div style="display: flex; gap: 10px; justify-content: flex-end;">
                    <button type="button" id="btn-cancel-instructor" class="card-crud-btn" style="padding: 8px 16px;">İptal</button>
                    <button type="button" id="btn-save-instructor" class="submit-btn" style="width: auto; padding: 8px 20px; margin-top: 0;">Ekle</button>
                </div>
            </div>
        </div>
    </div>

    <div id="tags-edit-modal" class="modal-overlay d-none">
        <div class="modal-content" style="max-width: 500px; padding: 25px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px);">
            <span id="tags-modal-close-btn" class="modal-close" style="top: 15px; right: 20px;">&times;</span>
            <h3 id="edit-tags-title" style="color: #fff; margin-bottom: 20px; font-weight: 600;">✏️ Etiketleri Düzenle</h3>
            
            <div class="form-group">
                <div class="tags-input-container" id="modal-tags-wrapper">
                    <div id="modal-chips-area" style="display: inline-flex; flex-wrap: wrap; gap: 6px;"></div>
                    <div class="autocomplete-wrapper" style="flex: 1; min-width: 150px; position: relative;">
                        <input type="text" id="modal-tags-input" placeholder="Yeni etiket yazıp virgül koyun...">
                        <div id="modal-autocomplete-list" class="autocomplete-suggestions d-none"></div>
                    </div>
                </div>
            </div>
            
            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
                <button type="button" id="btn-save-modal-tags" class="submit-btn" style="width: auto; padding: 8px 24px; margin-top: 0;">💾 Değişiklikleri Kaydet</button>
            </div>
        </div>
    </div>

    <div id="custom-alert-modal" class="modal-overlay d-none" style="z-index: 10000;">
        <div class="modal-content" style="max-width: 400px; padding: 25px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(25px); text-align: center; border: 1px solid rgba(255,255,255,0.15);">
            <div id="custom-alert-icon" style="font-size: 3rem; margin-bottom: 15px;">🔔</div>
            <p id="custom-alert-message" style="color: #fff; font-size: 1rem; line-height: 1.5; margin-bottom: 25px; white-space: pre-line;"></p>
            <div style="display: flex; gap: 12px; justify-content: center;">
                <button type="button" id="custom-alert-cancel-btn" class="card-crud-btn d-none" style="padding: 10px 20px; font-weight: 500;">İptal</button>
                <button type="button" id="custom-alert-confirm-btn" class="submit-btn" style="width: auto; padding: 10px 30px; margin-top: 0; font-weight: 600;">Tamam</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
