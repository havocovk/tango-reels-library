<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arjantin Tango Kombinasyon Kütüphanesi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-glow current-location-glow"></div>
    <div class="secondary-glow bg-glow"></div>

    <div class="app-container">
        
        <nav class="sidebar-glass">
            <div class="sidebar-header">
                <h2 id="sidebar-title">💃 ATKK</h2>
                <button id="lang-toggle-btn" class=\"lang-btn\">🇬🇧 EN</button>
            </div>
            <hr style="border-color: rgba(255,255,255,0.1); margin: 15px 0;">
            <div class="menu-items">
                <button id="menu-library" class="menu-btn active">📚 Kütüphane</button>
                <button id="menu-favorites" class="menu-btn">⭐ Pratik Listem</button>
                <button id="menu-add-video" class="menu-btn">➕ Yeni Video Ekle</button>
            </div>
        </nav>

        <main class="content-area">
            
            <header class="top-header">
                <h1 id="main-title">Arjantin Tango Kombinasyon Kütüphanesi</h1>
            </header>

            <section id="library-view" class="view-section">
                <div class="filter-bar-glass">
                    <input type="text" id="search-input" placeholder="Eğitmen, partner veya etiket (tag) ara...">
                    
                    <select id="filter-role-select">
                        <option value="ALL">Tüm Roller</option>
                        <option value="LEADER">Lider</option>
                        <option value="FOLLOWER">Takipçi</option>
                        <option value="BOTH">Her İkisi</option>
                    </select>

                    <select id="filter-location-select">
                        <option value="ALL">Tüm Ortamlar</option>
                        <option value="DRIVE">💾 Google Drive</option>
                        <option value="SOCIAL">🌐 Sosyal Medya</option>
                    </select>

                    <button id="filter-btn" class="action-btn">🔍 Filtrele</button>
                </div>

                <div class="action-bar-container">
                    <button id="btn-clear-favorites" class="clear-fav-btn d-none">🗑️ Bu Haftanın Pratik Listesini Temizle</button>
                </div>

                <div id="video-grid" class="grid-layout">
                    </div>
            </section>

            <section id="add-video-view" class="view-section d-none">
                <div class="form-container-glass">
                    <h2 id="form-title" class="section-subtitle">➕ Yeni Video Kaydet</h2>
                    <form id="add-video-form">
                        
                        <div class="form-group">
                            <label id="lbl-title" for="video-title">Kombinasyon Adı / Tanım:</label>
                            <input type="text" id="video-title" required>
                        </div>

                        <div class="form-group">
                            <label id="lbl-url" for="video-url">Video Linki (Drive / Instagram / YouTube):</label>
                            <input type="url" id="video-url" required>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label id="lbl-role" for="video-role">Rol:</label>
                                <select id="video-role">
                                    <option value="LEADER">Lider</option>
                                    <option value="FOLLOWER">Takipçi</option>
                                    <option value="BOTH">Her İkisi</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label id="lbl-location" for="video-location">Ortam:</label>
                                <select id="video-location">
                                    <option value="DRIVE">💾 Google Drive</option>
                                    <option value="SOCIAL">🌐 Sosyal Medya</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group instructor-section-box">
                            <label id="lbl-instructor" for="video-instructor">Eğitmen Ekle/Seç:</label>
                            <div class="instructor-input-row">
                                <select id="video-instructor" required>
                                    <option value="">-- Eğitmen Seçin --</option>
                                </select>
                                <button type="button" id="btn-toggle-instructor-panel" class="manage-ins-btn">⚙️</button>
                            </div>

                            <div id="new-instructor-container" class="instructor-management-panel d-none">
                                <label id="lbl-new-instructor-name" for="new-instructor-name">Eğitmen Adı:</label>
                                <div class="instructor-action-group">
                                    <input type="text" id="new-instructor-name">
                                    <button type="button" id="btn-save-instructor" class="ins-btn-add">Ekle</button>
                                    <button type="button" id="btn-delete-instructor" class="ins-btn-delete">Sil</button>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label id="lbl-partner" for="video-partner">Partner (Opsiyonel):</label>
                            <input type="text" id="video-partner">
                        </div>

                        <div class="form-group">
                            <label id="lbl-cover-upload">Kapak Görseli:</label>
                            <div id="drop-area" class="upload-drop-zone">
                                <p id="drop-area-text">📸 Buraya tıklayın ve Ctrl + V ile ekran görüntüsü yapıştırın</p>
                                <img id="image-preview" src="" alt="Önizleme" class="d-none">
                            </div>
                        </div>

                        <div class="form-group">
                            <label id="lbl-tags" for="form-tags-input">Etiketler (Virgül ile ayırın):</label>
                            <div class="tags-input-container" id="form-tags-wrapper">
                                <div id="form-chips-area" style="display: inline-flex; flex-wrap: wrap; gap: 6px;"></div>
                                <div class="autocomplete-wrapper" style="flex: 1; min-width: 150px; position: relative;">
                                    <input type="text" id="form-tags-input" placeholder="Yeni etiket yazıp virgül koyun...">
                                    <div id="form-autocomplete-list" class="autocomplete-suggestions d-none"></div>
                                </div>
                            </div>
                        </div>

                        <button type="submit" id="btn-save" class="submit-btn">🚀 Kütüphaneye Kaydet</button>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <div id="video-modal" class="modal-overlay d-none">
        <div class="modal-content text-center">
            <span id="modal-close-btn" class="modal-close">&times;</span>
            <div class="video-container">
                <iframe id="modal-iframe" src="" allowfullscreen></iframe>
            </div>
            <a id="modal-fallback-link" href="#" target="_blank" class="fallback-link d-none">🔗 Videoyu Harici Sekmede Aç</a>
        </div>
    </div>

    <div id="tags-edit-modal" class="modal-overlay d-none">
        <div class="modal-content" style="max-width: 500px; padding: 25px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px);">
            <span id="tags-modal-close-btn" class="modal-close" style="top: 15px; right: 20px;">&times;</span>
            <h3 id="edit-tags-title" style="color: #fff; margin-bottom: 20px; font-weight: 600;">✏️ Etiketleri Düzenle</h3>
            
            <div class="form-group">
                <div class="tags-input-container" id="modal-tags-wrapper">
                    <div id="modal-chips-area" style="display: inline-flex; flex-wrap: wrap; gap: 6px;"></div>
                    <div class="autocomplete-wrapper" style="flex: 1; min-width: 150px; position: relative;">
                        <input type="text" id="modal-tags-input" placeholder="Yeni etiket yazıp virgül koyun...">
                        <div id="modal-autocomplete-list" class="autocomplete-suggestions d-none"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="notification-modal" class="modal-overlay d-none">
        <div class="modal-content" style="max-width: 450px; padding: 25px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); text-align: center;">
            <p id="notification-message" style="color: #fff; font-size: 1.1rem; margin-bottom: 25px; font-weight: 500; white-space: pre-line;"></p>
            <div id="notification-actions" style="display: flex; justify-content: center; gap: 12px;">
                <button id="notification-btn-close" class="action-btn" style="background: linear-gradient(135deg, #38bdf8, #0284c7); padding: 8px 24px; border-radius: 8px;">Kapat</button>
                <button id="notification-btn-confirm" class="action-btn d-none" style="background: linear-gradient(135deg, #ef4444, #b91c1c); padding: 8px 24px; border-radius: 8px;">Evet</button>
                <button id="notification-btn-cancel" class="action-btn d-none" style="background: rgba(255,255,255,0.1); padding: 8px 24px; border-radius: 8px;">İptal</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
