<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arjantin Tango Kombinasyon Kütüphanesi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="temel.css">
    <link rel="stylesheet" href="kartlar.css">
    <link rel="stylesheet" href="formlar.css">

    <style>
        .vortex-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #060205; /* Çok derin tango gecesi taban rengi */
            z-index: -2;
            overflow: hidden;
            pointer-events: none;
        }

        /* Renk kollarını organik bir sıvı kıvrımına dönüştüren gelişmiş kontrast ve blur filtresi */
        .vortex-blend-wrapper {
            width: 100%;
            height: 100%;
            filter: blur(50px) contrast(1.4) saturate(1.3);
            background: #060205;
            position: relative;
        }

        /* Girdabın ana Tango Kırmızısı akış kolu */
        .vortex-arm-red {
            position: absolute;
            top: 15%;
            left: 30%;
            width: 65vw;
            height: 65vh;
            background: radial-gradient(ellipse at center, #800c24 0%, rgba(128, 12, 36, 0) 75%);
            transform: rotate(-28deg) scaleX(1.9);
            opacity: 0.85;
        }

        /* Girdabın derin mürdüm/kadife kıvrım kolu */
        .vortex-arm-plum {
            position: absolute;
            top: 35%;
            left: 10%;
            width: 60vw;
            height: 60vh;
            background: radial-gradient(ellipse at center, #4c0519 0%, rgba(76, 5, 25, 0) 70%);
            transform: rotate(32deg) scaleX(1.6);
            opacity: 0.9;
        }

        /* Girdabın ışık saçan asil mor/gece mavisi geçiş tonu */
        .vortex-arm-violet {
            position: absolute;
            top: 5%;
            left: 50%;
            width: 55vw;
            height: 55vh;
            background: radial-gradient(ellipse at center, #2e1065 0%, rgba(46, 16, 101, 0) 70%);
            transform: rotate(-55deg) scaleX(1.7);
            opacity: 0.65;
        }

        /* Alt kısımdaki derinliği sağlayan karanlık girdap merkezi */
        .vortex-arm-deep {
            position: absolute;
            bottom: -5%;
            right: 5%;
            width: 75vw;
            height: 75vh;
            background: radial-gradient(circle at center, #020617 0%, transparent 85%);
            opacity: 0.95;
        }

        /* Üst kısımdaki ışık kırılmasını ve cam arkası ipeksi parıltıyı veren ipek tül katmanı */
        .vortex-silk-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.04) 0%, transparent 45%, rgba(0, 0, 0, 0.5) 100%),
                        linear-gradient(45deg, rgba(128, 12, 36, 0.08) 0%, transparent 60%);
            mix-blend-mode: overlay;
        }
    </style>
</head>
<body>

    <div class="vortex-container">
        <div class="vortex-blend-wrapper">
            <div class="vortex-arm-red"></div>
            <div class="vortex-arm-plum"></div>
            <div class="vortex-arm-violet"></div>
            <div class="vortex-arm-deep"></div>
        </div>
        <div class="vortex-silk-overlay"></div>
    </div>

    <div class="app-container">
        
        <nav class="sidebar-glass">
            <div class="sidebar-header">
                <h2 id="sidebar-title">💃 ATKK</h2>
                <button id="lang-toggle-btn" class="lang-btn">🇬🇧 EN</button>
            </div>
            <hr style="border-color: rgba(255,255,255,0.1); margin: 15px 0;">
            <div class="menu-items">
                <button id="menu-library" class="menu-btn active">📚 Kütüphane</button>
                <button id="menu-favorites" class="menu-btn">⭐ Pratik Listem</button>
                <button id="menu-add-video" class="menu-btn">➕ Yeni Video Ekle</button>
            </div>
        </nav>

        <main class="main-content-glass">

            <div id="view-library-container" class="view-panel">
                <div class="search-header">
                    <input type="text" id="search-input" placeholder="Eğitmen, partner veya etiket (tag) ara...">
                    <button id="filter-btn" class="btn-primary">🔍 Filtrele</button>
                </div>
                
                <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 12px; margin-bottom: 12px;">
                    
                    <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                        <select id="filter-role-select" style="flex: 1; min-width: 120px; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 10px; color: white;">
                            <option value="all" id="opt-all-roles">Tüm Roller</option>
                            <option value="Leader" id="opt-leader">Lider</option>
                            <option value="Follower" id="opt-follower">Takipçi</option>
                            <option value="Both" id="opt-both">Çift</option>
                        </select>

                        <select id="filter-instructor-select" style="flex: 1; min-width: 150px; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 10px; color: white;">
                            <option value="all">Tüm Eğitmenler</option>
                        </select>

                        <select id="filter-tag-select" style="flex: 1; min-width: 150px; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 10px; color: white;">
                            <option value="all">Tüm Etiketler</option>
                        </select>
                    </div>

                    <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                        <select id="filter-date-select" style="flex: 1; min-width: 150px; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 10px; color: white;">
                            <option value="all">Tüm Tarihler</option>
                        </select>

                        <select id="filter-location-select" style="flex: 1; min-width: 150px; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 10px; color: white;">
                            <option value="all" id="opt-all-locations">Tüm Ortamlar</option>
                            <option value="drive" id="opt-drive">💾 Google Drive</option>
                            <option value="social" id="opt-social">🌐 Sosyal Medya</option>
                        </select>
                    </div>

                </div>

                <div id="clear-favorites-container" class="d-none" style="margin: 10px 0;">
                    <button id="btn-clear-favorites" class="btn-clear-danger">🗑️ Bu Haftaki Pratik Listesini Temizle</button>
                </div>

                <div id="video-grid" class="video-grid">
                    <div class="info-msg" id="loading-msg">Veritabanı bağlantısı kuruluyor...</div>
                </div>
            </div>

            <div id="view-add-container" class="view-panel d-none">
                <form id="add-video-form" class="glass-form">
                    <h2 id="form-title" style="color: #fff; margin-bottom: 10px;">➕ Yeni Video Kaydet</h2>
                    
                    <div class="form-group">
                        <label id="lbl-instructor">Eğitmen Seç / Ekle:</label>
                        <div style="display: flex; gap: 10px;">
                            <select id="form-instructor-select" style="flex: 1;"></select>
                            <button type="button" id="btn-toggle-new-instructor" class="lang-btn">➕</button>
                            <button type="button" id="btn-edit-instructor" class="lang-btn">✏️</button>
                            <button type="button" id="btn-delete-instructor" class="lang-btn" style="background: rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.4);">🗑️</button>
                        </div>
                    </div>

                    <div id="new-instructor-container" class="form-group d-none" style="background: rgba(255,255,255,0.02); padding: 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);">
                        <label id="lbl-new-instructor-name">Eğitmen Adı:</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="text" id="form-new-instructor-input" placeholder="Örn: Juan D'Arienzo">
                            <input type="text" id="form-new-instructor-input" placeholder="Örn: Juan D'Arienzo">
                            <button type="button" id="btn-save-instructor" class="lang-btn" style="background: #38bdf8; color: #0f172a;">Ekle</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label id="lbl-video-url">Video URL (Instagram Reels / YouTube Shorts vb.):</label>
                        <input type="url" id="form-video-url" required placeholder="https://www.instagram.com/reels/...">
                    </div>

                    <div class="form-group">
                        <label id="lbl-cover-upload">Kapak Resmi:</label>
                        <div id="drop-area" tabindex="0">
                            <span id="drop-area-text">📸 Buraya tıklayın ve Ctrl + V ile ekran görüntüsünü yapıştırın</span>
                            <img id="image-preview" class="preview-img d-none" alt="Kapak Önizleme">
                        </div>
                    </div>

                    <div class="form-group">
                        <label id="lbl-role">Rol Tipi:</label>
                        <select id="form-role-select">
                            <option value="Both">Çift (Leader + Follower)</option>
                            <option value="Leader">Leader</option>
                            <option value="Follower">Follower</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label id="lbl-partner">Partner Adı (İsteğe Bağlı):</label>
                        <input type="text" id="form-partner-name" placeholder="Örn: Maria">
                    </div>

                    <div class="form-group">
                        <label id="lbl-tags">Teknik Etiketleri (Virgül koyun veya öneriden seçip Enter'a basın):</label>
                        <div class="tags-input-container" id="form-tags-wrapper">
                            <div id="chips-area" style="display: inline-flex; flex-wrap: wrap; gap: 6px;"></div>
                            <div class="autocomplete-wrapper" style="flex: 1; min-width: 150px; position: relative;">
                                <input type="text" id="form-tags-input" placeholder="Yazın ve virgül koyun..." style="border:none; padding:4px; background:transparent; width:100%; color:white; outline:none;">
                                <div id="autocomplete-list" class="autocomplete-suggestions d-none"></div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="checkbox-group">
                            <input type="checkbox" id="form-is-downloaded">
                            <span id="lbl-downloaded">Google Drive'a Yedeklendi mi?</span>
                        </label>
                    </div>

                    <div id="drive-url-container" class="form-group d-none" style="animation: fadeIn 0.3s ease;">
                        <label id="lbl-drive-url">Google Drive Video Paylaşım Linki:</label>
                        <input type="url" id="form-drive-url" placeholder="https://drive.google.com/file/d/.../view?usp=sharing">
                    </div>

                    <div id="assistant-panel" class="assistant-box">
                        <h4 id="assistant-title">💡 Akıllı Dosya İsmi Asistanı</h4>
                        <p id="assistant-text" style="font-size: 0.8rem; margin: 4px 0; color: #94a3b8;">İndirdiğiniz videoyu Drive'a yüklemeden önce ismini şu şekilde değiştirmeniz önerilir:</p>
                        <div id="assistant-filename-output" class="assistant-code">example_filename.mp4</div>
                    </div>

                    <button type="submit" id="btn-submit-video" class="btn-primary" style="width: 100%; padding: 14px; margin-top: 10px;">
                        💾 Veritabanına Kaydet
                    </button>
                </form>
            </div>
        </main>
    </div>

    <div id="video-modal" class="modal-overlay d-none">
        <div class="modal-content">
            <span id="modal-close-btn" class="modal-close">&times;</span>
            <div class="video-container">
                <iframe id="modal-iframe" src="" allow="autoplay" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <div id="tags-edit-modal" class="modal-overlay d-none">
        <div class="modal-content" style="max-width: 500px; padding: 25px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px);">
            <span id="tags-modal-close-btn" class="modal-close" style="top: 15px; right: 20px;">&times;</span>
            <h3 id="edit-tags-title" style="color: #fff; margin-bottom: 20px; font-weight: 600;">✏️ Etiketleri Düzenle</h3>
            
            <div class="form-group">
                <div class="tags-input-container" id="modal-tags-wrapper">
                    <div id="modal-chips-area" style="display: inline-flex; flex-wrap: wrap; gap: 6px;"></div>
                    <div class="autocomplete-wrapper" style="flex: 1; min-width: 150px; position: relative;">
                        <input type="text" id="modal-tags-input" placeholder="Yeni etiket yazıp virgül koyun..." style="border:none; padding:4px; background:transparent; width:100%; color:white; outline:none;">
                        <div id="modal-autocomplete-list" class="autocomplete-suggestions d-none"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="custom-dialog-modal" class="modal-overlay d-none" style="z-index: 10000;">
        <div class="modal-content" style="max-width: 400px; padding: 25px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(20px); border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); text-align: center; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);">
            <p id="custom-dialog-message" style="color: #fff; font-size: 16px; margin-bottom: 25px; line-height: 1.6; font-weight: 500;"></p>
            <div style="display: flex; justify-content: center; gap: 12px;">
                <button id="custom-dialog-cancel-btn" class="btn d-none" style="padding: 10px 24px; border-radius: 8px; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; font-weight: 500;">İptal</button>
                <button id="custom-dialog-ok-btn" class="btn" style="padding: 10px 24px; border-radius: 8px; background: #3b82f6; color: #fff; border: none; cursor: pointer; font-weight: 500;">Tamam</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
