<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arjantin Tango Kombinasyon Kütüphanesi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-glow current-location-glow"></div>
    <div class="secondary-glow bg-glow"></div>

    <div class="app-container">
        
        <nav class="sidebar-glass">
            <div class="sidebar-header">
                <h2 id="sidebar-title">💃 ATKK</h2>
                <button id="lang-toggle-btn" class="lang-btn">🇬🇧 EN</button>
            </div>
            <hr style="border-color: rgba(255,255,255,0.1); margin: 15px 0;">
            <div class="menu-items">
                <button id="menu-library" class="menu-btn active">📚 Kütüphane</button>
                <button id="menu-favorites" class="menu-btn">⭐ Pratik Listem</button>
                <button id="menu-add-video" class="menu-btn">➕ Yeni Video Ekle</button>
            </div>

            <div class="instructor-management-section" style="margin-top: auto; padding: 15px 0 0 0; border-top: 1px solid rgba(255,255,255,0.05);">
                <button id="btn-show-instructor-panel" class="menu-btn" style="background: rgba(255,255,255,0.02); margin-bottom: 8px;">👤 Eğitmenleri Yönet</button>
                <div id="new-instructor-container" class="d-none">
                    <div class="form-group" style="margin-bottom: 10px;">
                        <label id="lbl-new-instructor-name" style="font-size: 0.8rem; color: #94a3b8; display:block; margin-bottom:5px;">Eğitmen Adı:</label>
                        <input type="text" id="new-instructor-name" placeholder="Örn: Ali & Ayşe" style="padding: 8px 12px; font-size: 0.85rem;">
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <button id="btn-save-instructor" class="submit-btn" style="padding: 8px; font-size: 0.85rem;">➕ Ekle</button>
                        <button id="btn-delete-instructor" class="card-crud-btn btn-delete" style="padding: 8px; display: none; background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.2); color: #ef4444;">🗑️ Sil</button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="main-content">
            <div class="search-filter-bar glass-panel" id="top-filter-bar">
                <div class="search-wrapper">
                    <input type="text" id="search-input" placeholder="Eğitmen, partner veya etiket (tag) ara...">
                </div>
                <div class="filters-wrapper">
                    <select id="filter-role-select" class="filter-select">
                        <option value="all">🎬 Tüm Roller</option>
                        <option value="Leader">Leader</option>
                        <option value="Follower">Follower</option>
                        <option value="Both">Both</option>
                    </select>
                    <select id="filter-location-select" class="filter-select">
                        <option value="all">📍 Tüm Ortamlar</option>
                        <option value="Google Drive">💾 Google Drive</option>
                        <option value="Sosyal Medya">🌐 Sosyal Medya</option>
                    </select>
                    <button id="filter-btn" class="filter-btn">🔍 Filtrele</button>
                </div>
            </div>

            <div id="content-display-area">
                <div id="loading-message" class="status-message">Veritabanı bağlantısı kuruluyor......</div>
                <div id="cards-grid" class="cards-grid d-none"></div>
            </div>

            <div id="add-video-form-container" class="glass-panel d-none">
                <h2 id="form-title" style="margin-bottom: 25px; font-weight: 600; color: #fff;">➕ Yeni Video Kaydet</h2>
                <form id="add-video-form">
                    <div class="form-grid">
                        <div class="form-group">
                            <label id="lbl-instructor">Eğitmen / Çift *</label>
                            <select id="video-instructor" required></select>
                        </div>
                        <div class="form-group">
                            <label id="lbl-partner">Partner (Opsiyonel)</label>
                            <input type="text" id="video-partner" placeholder="Partner adı...">
                        </div>
                        <div class="form-group">
                            <label id="lbl-role">Rol *</label>
                            <select id="video-role" required>
                                <option value="Leader">Leader</option>
                                <option value="Follower">Follower</option>
                                <option value="Both">Both</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label id="lbl-location">Ortam *</label>
                            <select id="video-location" required>
                                <option value="Google Drive">Google Drive</option>
                                <option value="Sosyal Medya">Sosyal Medya</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group" style="margin-top: 15px;">
                        <label id="lbl-url">Video Linki (URL) *</label>
                        <input type="url" id="video-url" placeholder="https://..." required>
                    </div>

                    <div class="form-group" style="margin-top: 15px;">
                        <label id="lbl-tags">Etiketler (Kombinasyon, Eleman örn: Sacada, Giro, Boleo)</label>
                        <div class="tags-input-container" id="form-tags-wrapper">
                            <div id="form-chips-area" style="display: inline-flex; flex-wrap: wrap; gap: 6px;"></div>
                            <div class="autocomplete-wrapper" style="flex: 1; min-width: 150px; position: relative;">
                                <input type="text" id="form-tags-input" placeholder="Etiket yazıp virgül koyun...">
                                <div id="form-autocomplete-list" class="autocomplete-suggestions d-none"></div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group" style="margin-top: 15px;">
                        <label id="lbl-cover-upload">Kapak Görseli:</label>
                        <div id="drop-area" class="upload-drop-zone">
                            <p id="drop-area-text">📸 Buraya tıklayın ve Ctrl + V ile ekran görüntüsü yapıştırın</p>
                            <img id="image-preview" src="" alt="Önizleme" class="d-none">
                        </div>
                    </div>

                    <button type="submit" id="btn-submit-form" class="submit-btn" style="margin-top: 25px;">💾 Kitaplığa Kaydet</button>
                </form>
            </div>
        </main>
    </div>

    <div id="video-modal" class="modal-overlay d-none">
        <div class="modal-content">
            <span id="modal-close-btn" class="modal-close">&times;</span>
            <div class="video-container">
                <iframe id="modal-iframe" src="" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <div id="tags-edit-modal" class="modal-overlay d-none">
        <div class="modal-content" style="max-width: 500px; padding: 25px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px);">
            <span id="tags-modal-close-btn" class="modal-close" style="top: 15px; right: 20px;">&times;</span>
            <h3 id="edit-tags-title" style="color: #fff; margin-bottom: 20px; font-weight: 600;">✏️ Etiketleri Düzenle</h3>
            
            <div class="form-group">
                <div class="tags-input-container" id="modal-tags-wrapper" style="min-height: 100px; align-items: flex-start; align-content: flex-start; padding: 12px;">
                    <div id="modal-chips-area" style="display: inline-flex; flex-wrap: wrap; gap: 6px; width: 100%;"></div>
                    <div class="autocomplete-wrapper" style="flex: 1; min-width: 150px; position: relative; margin-top: 5px;">
                        <input type="text" id="modal-tags-input" placeholder="Yeni etiket yazıp virgül koyun..." style="background: transparent; border: none; padding: 4px 0; color: white; width: 100%; outline: none;">
                        <div id="modal-autocomplete-list" class="autocomplete-suggestions d-none"></div>
                    </div>
                </div>
            </div>
            
            <div style="margin-top: 20px; display: flex; justify-content: flex-end;">
                <button id="btn-close-tags-modal" class="submit-btn" style="width: auto; padding: 8px 20px; background: linear-gradient(135deg, #38bdf8, #0284c7);">Tamam</button>
            </div>
        </div>
    </div>

    <div id="custom-alert-modal" class="modal-overlay d-none" style="z-index: 10000;">
        <div class="modal-content" style="max-width: 400px; padding: 25px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.1); text-align: center; border-radius: 16px;">
            <div id="alert-icon" style="font-size: 2.5rem; margin-bottom: 15px;">🎉</div>
            <p id="alert-message" style="color: #f8fafc; font-size: 1rem; line-height: 1.5; margin-bottom: 20px; font-weight: 500;"></p>
            <div id="alert-buttons" style="display: flex; gap: 10px; justify-content: center;">
                <button id="alert-btn-confirm" class="submit-btn" style="width: auto; padding: 8px 24px; background: linear-gradient(135deg, #ef4444, #b91c1c); display: none;">Evet</button>
                <button id="alert-btn-close" class="submit-btn" style="width: auto; padding: 8px 24px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); color: #fff;">Tamam</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
