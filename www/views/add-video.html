<!-- views/add-video.html - Yeni video ekleme/düzenleme formu -->
<!-- ✅ GÜNCELLEME (Adım 4.1): YouTube metadata bilgi kutusu eklendi -->
<div id="view-add-container" class="view-panel d-none">
    <form id="add-video-form" class="glass-form" style="max-width:900px; margin:0 auto;">
        <h2 id="form-title">➕ Yeni Video Kaydet</h2>
        <div class="atkk-form-grid">
            <div class="atkk-form-column">
                <div class="form-group">
                    <label id="lbl-instructor">Eğitmen Seç / Ekle:</label>
                    <div style="display:flex; gap:8px;">
                        <select id="form-instructor-select" style="flex:1;"></select>
                        <button type="button" id="btn-toggle-new-instructor" class="lang-btn">➕</button>
                        <button type="button" id="btn-edit-instructor" class="lang-btn">✏️</button>
                        <button type="button" id="btn-delete-instructor" class="lang-btn" style="background:rgba(239,68,68,0.2);">🗑️</button>
                    </div>
                </div>
                <div id="new-instructor-container" class="form-group d-none" style="background:rgba(0,240,255,0.05); padding:10px; border-radius:10px;">
                    <label id="lbl-new-instructor-name">Eğitmen Adı:</label>
                    <div style="display:flex; gap:8px;">
                        <input type="text" id="form-new-instructor-input">
                        <button type="button" id="btn-save-instructor" class="lang-btn">Ekle</button>
                    </div>
                </div>
                <div class="form-group">
                    <label id="lbl-video-url">Video URL (Instagram Reels / YouTube Shorts vb.):</label>
                    <input type="url" id="form-video-url" placeholder="https://... (Drive için boş bırakabilirsiniz)">
                    <!-- ✅ YENİ (Adım 4.1): YouTube metadata bilgi kutusu -->
                    <div id="yt-meta-box" class="d-none" style="
                        margin-top: 8px;
                        padding: 10px 14px;
                        background: rgba(0, 240, 255, 0.06);
                        border: 1px solid rgba(0, 240, 255, 0.25);
                        border-radius: 10px;
                        display: flex;
                        align-items: center;
                        gap: 12px;
                    ">
                        <span style="font-size: 1.2rem;">📹</span>
                        <div style="flex:1; min-width:0;">
                            <div id="yt-meta-title" style="
                                font-size: 0.85rem;
                                font-weight: 600;
                                color: #f1f5f9;
                                white-space: nowrap;
                                overflow: hidden;
                                text-overflow: ellipsis;
                            "></div>
                            <div id="yt-meta-duration" style="
                                font-size: 0.75rem;
                                color: #00f0ff;
                                margin-top: 2px;
                            "></div>
                        </div>
                    </div>
                </div>
                <div class="atkk-inline-row">
                    <div class="form-group">
                        <label id="lbl-role">Rol Tipi:</label>
                        <select id="form-role-select">
                            <option value="Both">Çift</option>
                            <option value="Leader">Lider</option>
                            <option value="Follower">Takipçi</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label id="lbl-partner">Partner Adı (İsteğe Bağlı):</label>
                        <input type="text" id="form-partner-name">
                    </div>
                </div>
                <div class="form-group">
                    <label id="lbl-tags">Teknik Etiketleri:</label>
                    <div class="tags-input-container" id="form-tags-wrapper">
                        <div id="chips-area" style="display:inline-flex; flex-wrap:wrap; gap:6px;"></div>
                        <div class="autocomplete-wrapper" style="flex:1; min-width:140px; position:relative;">
                            <input type="text" id="form-tags-input" placeholder="Yazın ve virgül koyun..." style="border:none; padding:4px; background:transparent; width:100%; outline:none;">
                            <div id="autocomplete-list" class="autocomplete-suggestions d-none"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="atkk-form-column">
                <div class="form-group">
                    <label id="lbl-cover-upload">Kapak Resmi:</label>
                    <div id="drop-area" tabindex="0">
                        <span id="drop-area-text">📸 Tıklayıp Ctrl + V ile ekran görüntüsü yapıştırın</span>
                        <img id="image-preview" class="preview-img d-none" alt="Kapak Önizleme">
                    </div>
                    <div style="display: flex; gap: 8px; margin-top: 8px;">
                        <button type="button" id="select-file-btn" class="lang-btn" style="flex:1;">📁 Dosya Seç</button>
                        <input type="file" id="cover-file-input" accept="image/*" style="display: none;">
                    </div>
                    <button type="button" id="btn-reset-cover" class="lang-btn" style="margin-top:6px; width:100%; background:rgba(239,68,68,0.15);">🗑️ Resmi Sıfırla</button>
                </div>
                <div class="form-group">
                    <label id="lbl-downloaded">
                        <input type="checkbox" id="form-is-downloaded" style="margin-right:6px;">
                        <span id="lbl-downloaded-text">Drive'a İndirildi</span>
                    </label>
                </div>
                <div id="drive-url-container" class="form-group d-none">
                    <label id="lbl-drive-url">Google Drive Linki:</label>
                    <input type="url" id="form-drive-url" placeholder="https://drive.google.com/...">
                </div>
                <button type="button" id="btn-submit-video" class="submit-btn">💾 Kaydet</button>
            </div>
        </div>
    </form>
</div>
