<!-- views/add-video.html - Yeni video ekleme/düzenleme formu -->
<!-- ✅ GÜNCELLEME (Adım 4.1): YouTube metadata bilgi kutusu eklendi -->
<!-- ✅ GÜNCELLEME (Button Unification):
     - btn-submit-video → btn-action-save
     - select-file-btn  → btn-action-file
     - btn-reset-cover  → btn-action-reset -->
<div id="view-add-container" class="view-panel d-none">
    <form id="add-video-form" class="glass-form" style="max-width:900px; margin:0 auto;">
        <h2 id="form-title">➕ Yeni Video Kaydet</h2>
        <div class="atkk-form-grid">

            <!-- Sol Kolon -->
            <div class="atkk-form-column">
                <div class="form-group">
                    <label id="lbl-instructor">Eğitmen Seç / Ekle:</label>
                    <div style="display:flex; gap:8px;">
                        <select id="form-instructor-select" style="flex:1;"></select>
                        <button type="button" id="btn-toggle-new-instructor" class="lang-btn">➕</button>
                        <button type="button" id="btn-edit-instructor" class="lang-btn">✏️</button>
                        <button type="button" id="btn-delete-instructor" class="lang-btn" style="background:rgba(239,68,68,0.2);">🗑️</button>
                    </div>
                </div>

                <div id="new-instructor-container" class="form-group d-none" style="background:rgba(0,240,255,0.05); padding:10px; border-radius:10px;">
                    <label id="lbl-new-instructor-name">Eğitmen Adı:</label>
                    <div style="display:flex; gap:8px;">
                        <input type="text" id="form-new-instructor-input">
                        <button type="button" id="btn-save-instructor" class="lang-btn">Ekle</button>
                    </div>
                </div>

                <div class="form-group">
                    <label id="lbl-video-url">Video URL (Instagram Reels / YouTube Shorts vb.):</label>
                    <input type="url" id="form-video-url" placeholder="https://... (Drive için boş bırakabilirsiniz)">
                </div>

                <div style="display:flex; gap:12px; flex-wrap:wrap;">
                    <div class="form-group" style="flex:1;">
                        <label id="lbl-role">Rol Tipi:</label>
                        <select id="form-role-select">
                            <option value="Both" id="opt-both-role">Çift</option>
                            <option value="Leader" id="opt-leader-role">Lider</option>
                            <option value="Follower" id="opt-follower-role">Takipçi</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label id="lbl-partner">Partner Adı (İsteğe Bağlı):</label>
                        <input type="text" id="form-partner-name" placeholder="Orn: Maria">
                    </div>
                </div>

                <div class="form-group">
                    <label id="lbl-tags">Teknik Etiketleri (Virgül koyun veya öneriden seçip Enter'a basın):</label>
                    <input type="text" id="form-tags-input" placeholder="Yazın ve virgül koyun...">
                    <div id="form-tags-chips" class="chips-container"></div>
                    <div id="autocomplete-dropdown" class="autocomplete-dropdown d-none"></div>
                </div>
            </div>

            <!-- Sağ Kolon -->
            <div class="atkk-form-column">
                <div class="form-group">
                    <label id="lbl-cover">Kapak Resmi:</label>
                    <div id="cover-preview-container" style="
                        border: 2px dashed rgba(0,240,255,0.3);
                        border-radius: 12px;
                        padding: 16px;
                        text-align: center;
                        background: rgba(11,8,19,0.4);
                        margin-bottom: 10px;
                        min-height: 80px;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        cursor: pointer;
                    ">
                        <span id="cover-preview-hint" style="color:#475569; font-size:0.85rem;">
                            📋 Buraya tıklayın ve Ctrl + V ile ekran görüntüsünü yapıştırın
                        </span>
                        <img id="cover-preview-img" style="max-width:100%; max-height:140px; border-radius:8px; display:none;" alt="Kapak önizleme">
                    </div>

                    <!-- ✅ Dosya Seç → btn-action-file -->
                    <div style="display:flex; gap:8px; margin-top:8px;">
                        <button type="button" id="select-file-btn" class="btn-action-file">📁 Dosya Seç</button>
                        <input type="file" id="cover-file-input" accept="image/*" style="display:none;">
                    </div>

                    <!-- ✅ Resmi Sıfırla → btn-action-reset -->
                    <button type="button" id="btn-reset-cover" class="btn-action-reset" style="margin-top:8px;">🗑️ Resmi Sıfırla</button>
                </div>

                <div class="form-group" style="background:rgba(255,0,127,0.05); padding:10px; border-radius:10px;">
                    <label class="checkbox-group">
                        <input type="checkbox" id="form-is-downloaded">
                        <span id="lbl-downloaded">Google Drive'a Yedeklendi mi?</span>
                    </label>
                    <div id="drive-url-container" class="d-none" style="margin-top:8px;">
                        <label id="lbl-drive-url" style="font-size:0.75rem;">Drive Paylaşım Linki:</label>
                        <input type="url" id="form-drive-url" placeholder="https://drive.google.com/file/d/...">
                    </div>
                </div>

                <div id="assistant-panel" class="compact-assistant-box">
                    <h4 id="assistant-title">💡 Dosya İsmi Asistanı</h4>
                    <p id="assistant-text">Drive yüklemesi öncesi önerilen isim şablonu:</p>
                    <div id="assistant-filename-output" class="assistant-code">example_filename.mp4</div>
                </div>
            </div>
        </div>

        <!-- ✅ Veritabanına Kaydet → btn-action-save -->
        <button type="submit" id="btn-submit-video" class="btn-action-save">💾 Veritabanına Kaydet</button>
    </form>
</div>
