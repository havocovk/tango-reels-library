<!-- views/add-video.html - Yeni video ekleme/düzenleme formu -->
<div id="view-add-container" class="view-panel d-none">
    <form id="add-video-form" class="glass-form" style="max-width:900px; margin:0 auto;">
        <!-- language.js innerHTML ile doldurur (ikon + başlık) -->
        <h2 id="form-title" style="display:flex; align-items:center; gap:8px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            Yeni Video Kaydet
        </h2>

        <div class="atkk-form-grid">

            <!-- ── SOL KOLON ────────────────────────────── -->
            <div class="atkk-form-column">

                <div class="form-group">
                    <label id="lbl-instructor">Eğitmen Seç / Ekle:</label>
                    <div style="display:flex; gap:8px;">
                        <select id="form-instructor-select" style="flex:1;"></select>
                        <button type="button" id="btn-toggle-new-instructor" class="lang-btn" title="Yeni Eğitmen Ekle">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                        </button>
                        <button type="button" id="btn-edit-instructor" class="lang-btn" title="Eğitmeni Düzenle">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#c026d3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" aria-hidden="true"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
                        </button>
                        <button type="button" id="btn-delete-instructor" class="lang-btn" title="Eğitmeni Sil" style="background:rgba(239,68,68,0.2);">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                        </button>
                    </div>
                </div>

                <div id="new-instructor-container" class="form-group d-none"
                     style="background:rgba(0,240,255,0.05); padding:10px; border-radius:10px;">
                    <label id="lbl-new-instructor-name">Eğitmen Adı:</label>
                    <div style="display:flex; gap:8px;">
                        <input type="text" id="form-new-instructor-input">
                        <button type="button" id="btn-save-instructor" class="lang-btn">Ekle</button>
                    </div>
                </div>

                <div class="form-group">
                    <label id="lbl-video-url">Video URL (Instagram Reels / YouTube Shorts vb.):</label>
                    <input type="url" id="form-video-url"
                           placeholder="https://... (Drive için boş bırakabilirsiniz)">
                    <div id="yt-meta-box" class="d-none" style="
                        margin-top: 8px;
                        padding: 10px 14px;
                        background: rgba(0, 240, 255, 0.06);
                        border: 1px solid rgba(0, 240, 255, 0.25);
                        border-radius: 10px;
                        display: flex;
                        align-items: center;
                        gap: 12px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" aria-hidden="true"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                        <div style="flex:1; min-width:0;">
                            <div id="yt-meta-title" style="
                                font-size: 0.85rem;
                                font-weight: 600;
                                color: #f1f5f9;
                                white-space: nowrap;
                                overflow: hidden;
                                text-overflow: ellipsis;"></div>
                            <div id="yt-meta-duration" style="
                                font-size: 0.75rem;
                                color: #00f0ff;
                                margin-top: 2px;"></div>
                        </div>
                    </div>
                </div>

                <!-- İçerik türü seçimi -->
                <div class="form-group" style="margin-bottom:14px;">
                    <label id="lbl-content-type" style="font-weight:600;color:rgba(255,255,255,0.8);">İçerik Türü:</label>
                    <div style="display:flex;gap:10px;margin-top:8px;">
                        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
                            <input type="radio" name="content_type" id="ct-combination" value="combination" checked
                                style="accent-color:#ff007f;">
                            <span id="lbl-ct-combination" style="font-size:0.85rem;color:rgba(255,255,255,0.75);">Kombinasyon</span>
                        </label>
                        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
                            <input type="radio" name="content_type" id="ct-show" value="show"
                                style="accent-color:#c026d3;">
                            <span id="lbl-ct-show" style="font-size:0.85rem;color:rgba(255,255,255,0.75);">Tango Şovu</span>
                        </label>
                    </div>
                </div>

                <div class="atkk-inline-row">
                    <div class="form-group">
                        <label id="lbl-role">Rol Tipi:</label>
                        <select id="form-role-select">
                            <option value="Both"     id="opt-both-role">Çift</option>
                            <option value="Leader"   id="opt-leader-role">Lider</option>
                            <option value="Follower" id="opt-follower-role">Takipçi</option>
                        </select>
                    </div>
                    <div class="form-group" style="position:relative;">
                        <label id="lbl-partner">Partner Adı (İsteğe Bağlı):</label>
                        <input type="text" id="form-partner-name" placeholder="Örn: Maria" autocomplete="off">
                        <div id="partner-autocomplete-list" class="autocomplete-items" style="position:absolute;z-index:100;width:100%;"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label id="lbl-tags">Teknik Etiketleri (Virgül koyun veya öneriden seçip Enter'a basın):</label>
                    <div class="tags-input-container" id="form-tags-wrapper">
                        <div id="chips-area" style="display:inline-flex; flex-wrap:wrap; gap:6px;"></div>
                        <div class="autocomplete-wrapper" style="flex:1; min-width:140px; position:relative;">
                            <input type="text" id="form-tags-input"
                                   placeholder="Yazın ve virgül koyun..."
                                   style="border:none; padding:4px; background:transparent; width:100%; outline:none; color:#f1f5f9;">
                            <div id="autocomplete-list" class="autocomplete-suggestions d-none"></div>
                        </div>
                    </div>
                </div>

            </div>
            <!-- ── SOL KOLON SONU ────────────────────────── -->

            <!-- ── SAĞ KOLON ─────────────────────────────── -->
            <div class="atkk-form-column">

                <div class="form-group">
                    <label id="lbl-cover-upload">Kapak Resmi:</label>

                    <div style="display:flex; gap:6px; align-items:stretch;">

                        <!-- Kapak önizleme + drop area -->
                        <div id="drop-area" tabindex="0" style="flex:1;">
                            <!-- language.js innerHTML ile doldurur -->
                            <span id="drop-area-text" style="display:flex; align-items:center; gap:6px;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                                Tıklayın ve Ctrl + V ile ekran görüntüsü yapıştırın
                            </span>
                            <img id="image-preview" class="preview-img d-none" alt="Kapak Önizleme">
                        </div>

                        <!-- Dosya seç ve sıfırla — sadece ikon -->
                        <div style="display:flex; flex-direction:column; gap:4px; flex-shrink:0; width:38px;">

                            <button type="button" id="select-file-btn"
                                    title="Dosya Seç"
                                    style="flex:1; min-height:0; padding:0;
                                           background:rgba(0,240,255,0.08);
                                           border:1px solid rgba(0,240,255,0.38);
                                           color:#00f0ff; border-radius:10px; cursor:pointer;
                                           display:flex; align-items:center; justify-content:center;
                                           transition:background 0.2s, box-shadow 0.2s;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                            </button>
                            <input type="file" id="cover-file-input" accept="image/*" style="display:none;">

                            <button type="button" id="btn-reset-cover"
                                    title="Resmi Sıfırla"
                                    style="flex:1; min-height:0; padding:0;
                                           background:rgba(239,68,68,0.10);
                                           border:1px solid rgba(239,68,68,0.40);
                                           color:#ef4444; border-radius:10px; cursor:pointer;
                                           display:flex; align-items:center; justify-content:center;
                                           transition:background 0.2s, box-shadow 0.2s;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                            </button>

                        </div>
                    </div>
                </div>

                <div class="form-group"
                     style="background:rgba(255,0,127,0.05); padding:10px; border-radius:10px;">
                    <label class="checkbox-group">
                        <input type="checkbox" id="form-is-downloaded">
                        <span id="lbl-downloaded">Google Drive'a Yedeklendi mi?</span>
                    </label>
                    <div id="drive-url-container" class="d-none" style="margin-top:8px;">
                        <label id="lbl-drive-url" style="font-size:0.75rem;">Drive Paylaşım Linki:</label>
                        <input type="url" id="form-drive-url"
                               placeholder="https://drive.google.com/file/d/...">
                    </div>
                </div>

                <div id="assistant-panel" class="compact-assistant-box">
                    <!-- language.js innerHTML ile doldurur -->
                    <h4 id="assistant-title" style="display:flex; align-items:center; gap:6px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" aria-hidden="true"><line x1="9" y1="18" x2="15" y2="18"/><line x1="10" y1="22" x2="14" y2="22"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/></svg>
                        Akıllı Dosya İsmi Asistanı
                    </h4>
                    <p id="assistant-text">İndirdiğiniz videoyu Drive'a yüklemeden önce ismini şu şekilde değiştirmeniz önerilir:</p>
                    <div id="assistant-filename-output" class="assistant-code">example_filename.mp4</div>
                </div>

            </div>
            <!-- ── SAĞ KOLON SONU ─────────────────────────── -->

        </div>

        <!-- language.js innerHTML ile doldurur -->
        <button type="submit" id="btn-submit-video" class="btn-action-save">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            Veritabanına Kaydet
        </button>

    </form>
</div>
