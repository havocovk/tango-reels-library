<!-- views/library.html - YENİ HALİ (arama kutusu ve Ara butonu eklendi) -->
<div id="view-library-container" class="view-panel">
    <!-- Arama satırı: input + Ara butonu -->
    <div class="search-header" style="display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 15px;">
        <input type="text" id="search-input" class="form-control" placeholder="Eğitmen, etiket, platform veya not ara..." style="flex: 3; background: rgba(11,8,19,0.8); border: 1px solid rgba(255,0,127,0.5); padding: 10px 16px; border-radius: 12px; color: #f1f5f9; outline: none;">
        <button id="search-btn" class="btn-primary">🔍 Ara</button>
    </div>

    <!-- Filtre dropdown'ları (aynı, değişmedi) -->
    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 12px; margin-bottom: 12px;">
        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
            <select id="filter-role-select" style="flex:1; background:rgba(11,8,19,0.8); border:1px solid rgba(255,0,127,0.5); padding:10px; border-radius:10px; color:#f1f5f9;">
                <option value="all" id="opt-all-roles">Tüm Roller</option>
                <option value="Leader" id="opt-leader">Lider</option>
                <option value="Follower" id="opt-follower">Takipçi</option>
                <option value="Both" id="opt-both">Çift</option>
            </select>
            <select id="filter-instructor-select" style="flex:1; background:rgba(11,8,19,0.8); border:1px solid rgba(255,0,127,0.5); padding:10px; border-radius:10px; color:#f1f5f9;">
                <option value="all">Tüm Eğitmenler</option>
            </select>
            <select id="filter-tag-select" style="flex:1; background:rgba(11,8,19,0.8); border:1px solid rgba(255,0,127,0.5); padding:10px; border-radius:10px; color:#f1f5f9;">
                <option value="all">Tüm Etiketler</option>
            </select>
        </div>
        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
            <select id="filter-date-select" style="flex:1; background:rgba(11,8,19,0.8); border:1px solid rgba(255,0,127,0.5); padding:10px; border-radius:10px; color:#f1f5f9;">
                <option value="all">Tüm Tarihler</option>
            </select>
            <select id="filter-platform-select" style="flex:1; background:rgba(11,8,19,0.8); border:1px solid rgba(255,0,127,0.5); padding:10px; border-radius:10px; color:#f1f5f9;">
                <option value="all">Tüm Platformlar</option>
                <option value="drive">Google Drive</option>
                <option value="youtube">YouTube</option>
                <option value="instagram">Instagram</option>
                <option value="facebook">Facebook</option>
            </select>
        </div>
    </div>

    <div id="total-video-count" style="text-align:right; margin:10px 0 5px 0; color:#00f0ff; font-size:1.1rem;"></div>
    <div id="clear-favorites-container" class="d-none" style="margin:10px 0;">
        <button id="btn-clear-favorites" class="btn-clear-danger">🗑️ Bu Haftaki Pratik Listesini Temizle</button>
    </div>
    <div id="video-grid" class="video-grid">
        <div class="info-msg" id="loading-msg">Veritabanı bağlantısı kuruluyor...</div>
    </div>
    
    <!-- 🔥 YENİ: Sonsuz kaydırma için sentinel (gözlem noktası) -->
    <div id="scroll-sentinel" style="height: 1px;"></div>

    <div id="load-more-container" class="d-none" style="text-align:center; margin:25px 0 10px 0;">
        <button id="btn-load-more" class="btn-primary" style="padding:12px 35px;">➕ Daha Fazla Video Yükle</button>
    </div>
</div>
