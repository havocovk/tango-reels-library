<!-- views/dashboard.html — Adim 4.1 -->
<div id="view-dashboard-container" class="d-none">
    <div class="dashboard-wrapper">

        <div class="dashboard-header">
            <h1 class="dashboard-title">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;margin-right:8px;"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                <span id="dash-title">Genel Bakış</span>
            </h1>
            <p class="dashboard-subtitle" id="dash-subtitle">Kombinasyon koleksiyonunun özeti</p>
        </div>

        <div class="dashboard-row dashboard-row-top">

            <div class="dash-card dash-card-due">
                <div class="dash-card-icon-wrap dash-icon-cyan">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
                </div>
                <div class="dash-card-body">
                    <div class="dash-card-value" id="dash-due-count">—</div>
                    <div class="dash-card-label" id="dash-due-label">Bugün Tekrar</div>
                </div>
                <button class="dash-card-action" id="dash-start-practice">
                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    <span id="dash-practice-btn-text">Pratik Başlat</span>
                </button>
            </div>

            <div class="dash-card dash-card-learning">
                <div class="dash-card-icon-wrap dash-icon-amber">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                </div>
                <div class="dash-card-body">
                    <div class="dash-card-value" id="dash-learning-count">—</div>
                    <div class="dash-card-label" id="dash-learning-label">Öğreniliyor</div>
                </div>
            </div>

            <div class="dash-card dash-card-mastered">
                <div class="dash-card-icon-wrap dash-icon-green">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                </div>
                <div class="dash-card-body">
                    <div class="dash-card-value" id="dash-mastered-count">—</div>
                    <div class="dash-card-label" id="dash-mastered-label">Ustalaşıldı</div>
                </div>
            </div>

        </div>

        <div class="dashboard-row dashboard-row-mid">

            <div class="dash-card dash-card-total">
                <div class="dash-card-icon-wrap dash-icon-purple">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c026d3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                </div>
                <div class="dash-card-body">
                    <div class="dash-card-value" id="dash-total-count">—</div>
                    <div class="dash-card-label" id="dash-total-label">Toplam Video</div>
                </div>
            </div>

            <div class="dash-card dash-card-week">
                <div class="dash-card-icon-wrap dash-icon-pink">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ff007f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </div>
                <div class="dash-card-body">
                    <div class="dash-card-value" id="dash-week-count">—</div>
                    <div class="dash-card-label" id="dash-week-label">Bu Hafta Çalışıldı</div>
                </div>
            </div>

        </div>

        <div class="dash-card dash-card-toptags">
            <div class="dash-toptags-header">
                <div class="dash-card-icon-wrap dash-icon-cyan" style="width:32px;height:32px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                </div>
                <span class="dash-toptags-title" id="dash-toptags-title">En Çok Çalışılan Teknikler</span>
            </div>
            <div class="dash-toptags-list" id="dash-toptags-list">
                <span class="dash-toptags-empty" id="dash-toptags-empty">Henüz veri yok</span>
            </div>
        </div>

        <div class="dash-card dash-card-recent">
            <div class="dash-toptags-header">
                <div class="dash-card-icon-wrap dash-icon-amber" style="width:32px;height:32px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                </div>
                <span class="dash-toptags-title" id="dash-recent-title">Son Eklenen Videolar</span>
            </div>
            <div class="dash-recent-list" id="dash-recent-list"></div>
        </div>

    </div>
</div>
