<!-- views/tag-manager.html - Etiket Yönetimi görünümü -->
<div id="view-tag-manager-container" class="view-panel d-none">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px;">
        <!-- language.js innerHTML ile doldurur -->
        <h2 id="tag-manager-title" style="color:#f1f5f9; text-shadow:0 0 4px #ff007f; display:flex; align-items:center; gap:8px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ff007f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" aria-hidden="true"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
            Etiket Yönetimi
        </h2>
        <div style="display:flex; flex-wrap:wrap; gap:8px;">
            <!-- language.js innerHTML ile doldurur -->
            <button id="tag-manager-merge-btn" class="tag-action-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" aria-hidden="true"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/></svg>
                Birleştir
            </button>
            <button id="tag-manager-delete-btn" class="tag-action-btn tag-danger-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                Seçilenleri Sil
            </button>
            <button id="tag-manager-cleanup-btn" class="tag-action-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" aria-hidden="true"><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/></svg>
                Kullanılmayanları Temizle
            </button>
            <button id="tag-manager-health-btn" class="tag-action-btn" style="background:rgba(0,240,255,0.1); border-color:rgba(0,240,255,0.4); color:#00f0ff;">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                Sağlık Kontrolü
            </button>
        </div>
    </div>
    <div class="tag-table-card">
        <!-- Sütun genişlikleri stats-tagmanager.css'te (.tag-col-*).
             ÖNCESİ: genişlikler hem burada hem tagManager.js'te satır içi
             veriliyordu (36/80/90px) ve tablo min-width:420px ile kilitliydi;
             360px telefonda sığmadığı için yatay kaydırma gerekiyor, etiket
             sütunu solda kalıp kırpılıyordu. Artık mobilde sütunlar daralıyor
             ve tablo yana kaydırılmadan ekrana oturuyor.
             heatmap-scroll-wrapper DİKEY kaydırma (max-height:65vh) için
             duruyor; yatay kaydırma artık tetiklenmiyor. -->
        <!-- Birleştirme paneli tablonun ÜSTÜNDE: tablo max-height:65vh
             olduğu için panel altta kaldığında telefonda ekranın çok
             aşağısında kalıyor, iki etiket seçen kullanıcı paneli hiç
             göremiyordu. Şimdi aksiyon butonlarının hemen altında açılıyor. -->
        <div id="tag-merge-panel" class="tag-merge-panel d-none">
            <label>Yeni Etiket Adı:</label>
            <input type="text" id="tag-merge-new-name" class="tag-merge-input" placeholder="Örn: sacada">
            <!-- language.js innerHTML ile doldurur -->
            <button id="tag-merge-confirm-btn" class="tag-action-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
                Birleştir
            </button>
            <button id="tag-merge-cancel-btn" class="tag-action-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                İptal
            </button>
        </div>
        <div class="heatmap-scroll-wrapper" style="max-height:65vh; overflow-y:auto;">
            <table class="tag-manager-table" id="tag-manager-table">
                <thead>
                    <tr>
                        <th class="tag-col-check"><input type="checkbox" id="tag-select-all" class="tag-checkbox"></th>
                        <th>Etiket</th>
                        <th class="tag-col-count">Kullanım</th>
                        <th class="tag-col-actions">İşlemler</th>
                    </tr>
                </thead>
                <tbody id="tag-manager-tbody"></tbody>
            </table>
        </div>
    </div>
</div>
