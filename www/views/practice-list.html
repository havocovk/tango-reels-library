<!-- views/practice-list.html — Pratik Listem -->
<div id="view-practice-list-container" class="view-panel d-none">

    <div class="library-sticky-bar">
    <div class="search-header" role="search" aria-label="Pratik listesi araması">
        <input type="text" id="practice-list-search-input" class="search-field"
            placeholder="Eğitmen, etiket, platform veya not ara..."
            aria-label="Pratik listesinde ara">
        <button id="practice-list-search-btn" class="btn-search" aria-label="Ara">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            Ara
        </button>
        <button id="pl-btn-start-practice" class="btn-start-practice" aria-label="Pratik modunu başlat">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
            Pratik Başlat
        </button>
        <button id="pl-btn-view-toggle" class="btn-view-toggle" title="Görünümü değiştir" aria-label="Liste veya grid görünümüne geç">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            Liste
        </button>
    </div>

    <div class="filter-groups" role="group" aria-label="Filtreler">
        <div class="filter-row">
            <select id="pl-filter-role-select" aria-label="Role göre filtrele" class="filter-select">
                <option value="all">Tüm Roller</option>
                <option value="Leader">Lider</option>
                <option value="Follower">Takipçi</option>
                <option value="Both">Çift</option>
            </select>
            <select id="pl-filter-instructor-select" aria-label="Eğitmene göre filtrele" class="filter-select">
                <option value="all">Tüm Eğitmenler</option>
            </select>
            <select id="pl-filter-tag-select" aria-label="Etikete göre filtrele" class="filter-select">
                <option value="all">Tüm Etiketler</option>
            </select>
        </div>
        <div class="filter-row">
            <select id="pl-filter-date-select" aria-label="Tarihe göre filtrele" class="filter-select">
                <option value="all">Tüm Tarihler</option>
                <option value="week">Bu Hafta</option>
                <option value="month">Bu Ay</option>
                <option value="3months">Son 3 Ay</option>
            </select>
            <select id="pl-filter-platform-select" aria-label="Platforma göre filtrele" class="filter-select">
                <option value="all">Tüm Platformlar</option>
                <option value="drive">Google Drive</option>
                <option value="youtube">YouTube</option>
                <option value="instagram">Instagram</option>
                <option value="facebook">Facebook</option>
            </select>
            <select id="pl-filter-learning-status-select" aria-label="Öğrenme durumuna göre filtrele" class="filter-select">
                <option value="all">Tüm Öğrenme Durumları</option>
                <option value="new">Yeni</option>
                <option value="learning">Çalışıyorum</option>
                <option value="mastered">Ustalaştım</option>
            </select>
        </div>
    </div>
    </div><!-- /library-sticky-bar -->

    <div id="practice-list-total-count" class="total-count"></div>

    <div id="clear-practice-list-container" style="margin:10px 0;">
        <button id="btn-clear-practice-list" class="btn-clear-danger">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
            Pratik Listesini Temizle
        </button>
    </div>

    <div id="practice-list-grid" class="video-grid">
        <div class="info-msg" id="practice-list-loading-msg">Yükleniyor...</div>
    </div>

    <div id="practice-list-scroll-sentinel" style="height:1px;"></div>

</div>
