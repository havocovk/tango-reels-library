<!-- modals/custom-dialog-modal.html -->
<div id="custom-dialog-modal" class="modal-overlay d-none" style="z-index:10000;">
    <div class="modal-content" style="max-width:400px; padding:25px; text-align:center;">
        <p id="custom-dialog-message" style="color:#f1f5f9; margin-bottom:25px;"></p>
        <div style="display:flex; justify-content:center; gap:12px;">
            <button id="custom-dialog-cancel-btn" class="btn d-none" style="padding:10px 24px; border-radius:8px; background:rgba(0,240,255,0.15);">İptal</button>
            <button id="custom-dialog-ok-btn" class="btn" style="padding:10px 24px; border-radius:8px; background:#ff007f; color:#0b0813;">Tamam</button>
        </div>
    </div>
</div>
