<!-- modals/annotation-modal.html -->
<div id="annotation-modal" class="modal-overlay d-none">
    <div class="modal-content" style="
        max-width: 560px;
        padding: 28px;
        max-height: 85vh;
        overflow-y: auto;
        border-color: rgba(0,240,255,0.4);
        box-shadow: 0 0 40px rgba(0,240,255,0.2);">
        <span id="annotation-modal-close-btn" class="modal-close">&times;</span>

        <h3 id="annotation-modal-title" style="
            font-size: 1.15rem;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg,#ff007f,#00f0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff007f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" aria-hidden="true" style="-webkit-text-fill-color:initial;"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            Zaman Notları
        </h3>

        <p id="annotation-modal-subtitle" style="
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 22px;
            min-height: 18px;"></p>

        <!-- Not ekleme formu -->
        <div style="
            background: rgba(0,240,255,0.04);
            border: 1px solid rgba(0,240,255,0.15);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 20px;">
            <div style="display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;">

                <div style="display:flex; flex-direction:column; gap:5px;">
                    <label style="font-size:0.75rem; color:#94a3b8; user-select:none; display:flex; align-items:center; gap:4px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        Dakika:Saniye
                    </label>
                    <input
                        id="annotation-timestamp-input"
                        type="text"
                        placeholder="örn. 1:32"
                        style="
                            width: 100px;
                            padding: 9px 10px;
                            background: rgba(11,8,19,0.9);
                            border: 1px solid rgba(255,0,127,0.35);
                            border-radius: 9px;
                            color: #f1f5f9;
                            font-size: 0.9rem;
                            outline: none;
                            font-family: 'Poppins', sans-serif;">
                </div>

                <div style="flex:1; display:flex; flex-direction:column; gap:5px; min-width:160px;">
                    <label style="font-size:0.75rem; color:#94a3b8; user-select:none; display:flex; align-items:center; gap:4px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
                        Not
                    </label>
                    <input
                        id="annotation-note-input"
                        type="text"
                        placeholder="Bu anda ne oluyor?"
                        style="
                            width: 100%;
                            padding: 9px 10px;
                            background: rgba(11,8,19,0.9);
                            border: 1px solid rgba(255,0,127,0.35);
                            border-radius: 9px;
                            color: #f1f5f9;
                            font-size: 0.9rem;
                            outline: none;
                            font-family: 'Poppins', sans-serif;">
                </div>

                <button id="annotation-add-btn" style="
                    padding: 9px 18px;
                    background: linear-gradient(135deg, #ff007f, #c026d3);
                    border: none;
                    border-radius: 9px;
                    color: #fff;
                    font-size: 0.9rem;
                    font-weight: 600;
                    cursor: pointer;
                    white-space: nowrap;
                    transition: opacity 0.2s;
                    font-family: 'Poppins', sans-serif;">
                    ＋ Ekle
                </button>
            </div>

            <p id="annotation-form-error" style="
                color: #ef4444;
                font-size: 0.8rem;
                margin-top: 8px;
                display: none;"></p>
        </div>

        <!-- Mevcut notlar listesi -->
        <div id="annotation-list-container">
            <!-- annotationManager.js tarafından doldurulur -->
        </div>
    </div>
</div>
