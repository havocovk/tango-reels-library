<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Arjantin Tango Kombinasyon Koleksiyonu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/buttons.css">
    <link rel="stylesheet" href="styles/cards.css">
    <link rel="stylesheet" href="styles/forms.css">
    <link rel="stylesheet" href="styles/modals.css">
    <link rel="stylesheet" href="styles/stats-tagmanager.css">
    <link rel="stylesheet" href="styles/practice-session.css">
    <link rel="stylesheet" href="styles/playlists.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/6.6.2/fuse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
    <link rel="manifest" href="manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Service worker registered:', reg.scope))
            .catch(err => console.error('Service worker error:', err));
        });
      }
    </script>
</head>
<body>

<!-- Ekran okuyucu için içeriğe atla bağlantısı -->
<a href="#main-content" class="skip-link">Ana içeriğe geç</a>

<div class="bg-glow current-location-glow"></div>
<div class="secondary-glow bg-glow"></div>

<div class="app-container">

    <!-- Sol Menü -->
    <nav class="sidebar-glass">
        <div class="sidebar-header">
            <h2 id="sidebar-title"></h2>
            <button id="lang-toggle-btn" class="lang-btn">🇬🇧 EN</button>
        </div>
        <hr style="border-color: rgba(0, 240, 255, 0.2); margin: 15px 0;">
        <div class="menu-items">
            <!-- language.js innerHTML ile doldurur (ikon + metin) -->
            <button id="menu-library"      class="menu-btn active">Koleksiyon</button>
            <button id="menu-favorites"    class="menu-btn">Pratik Listem</button>
            <button id="menu-stats"        class="menu-btn">İstatistikler</button>
            <button id="menu-add-video"    class="menu-btn">Yeni Video Ekle</button>
            <button id="menu-tag-manager"  class="menu-btn">Etiket Yönetimi</button>
            <button id="menu-instructors"  class="menu-btn">Eğitmenler</button>
        </div>

        <!-- Playlist bölümü -->
        <div id="playlist-section-container"></div>

        <!-- Çıkış butonu -->
        <div style="margin-top: auto; padding-top: 20px;">
            <hr style="border-color: rgba(255, 0, 127, 0.15); margin-bottom: 16px;">
            <button id="btn-logout" style="
                width: 100%;
                background: transparent;
                border: 1px solid rgba(255, 0, 127, 0.3);
                color: rgba(255, 255, 255, 0.45);
                border-radius: 10px;
                padding: 9px 14px;
                font-size: 0.8rem;
                font-family: 'Poppins', sans-serif;
                cursor: pointer;
                transition: all 0.2s;
                text-align: left;
                display: flex;
                align-items: center;
                gap: 8px;"
                onmouseover="this.style.borderColor='rgba(255,0,127,0.7)'; this.style.color='#ff007f'; this.style.background='rgba(255,0,127,0.08)'"
                onmouseout="this.style.borderColor='rgba(255,0,127,0.3)'; this.style.color='rgba(255,255,255,0.45)'; this.style.background='transparent'">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Çıkış Yap
            </button>
        </div>
    </nav>

    <!-- Ana İçerik -->
    <main class="main-content-glass" id="main-content" aria-label="Ana içerik">
        <div id="dynamic-views"></div>
    </main>

</div>

<!-- Yükleniyor göstergesi -->
<div id="loading-overlay" class="loading-overlay d-none">
    <div class="spinner"></div>
    <div id="loading-text">İşlem yapılıyor...</div>
</div>

<!-- Mobil Alt Navigasyon Barı -->
<nav class="bottom-nav" id="bottom-nav" aria-label="Alt navigasyon">
    <button class="bottom-nav-btn active" id="bn-library">
        <span class="bn-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        </span>
        <span class="bn-label" data-i18n="menuLibrary">Koleksiyon</span>
    </button>
    <button class="bottom-nav-btn" id="bn-favorites">
        <span class="bn-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        </span>
        <span class="bn-label" data-i18n="menuFavorites">Pratik</span>
    </button>
    <button class="bottom-nav-btn" id="bn-stats">
        <span class="bn-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        </span>
        <span class="bn-label" data-i18n="menuStats">İstatistik</span>
    </button>
    <button class="bottom-nav-btn" id="bn-add">
        <span class="bn-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        </span>
        <span class="bn-label" data-i18n="menuAdd">Ekle</span>
    </button>
    <button class="bottom-nav-btn" id="bn-tags">
        <span class="bn-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" aria-hidden="true"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
        </span>
        <span class="bn-label" data-i18n="menuTags">Etiketler</span>
    </button>
</nav>

<!-- Giriş Ekranı -->
<div id="login-overlay" style="
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 99999;
    background: #07040f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;">

    <div style="
        width: 100%;
        max-width: 400px;
        margin: 1rem;
        background: #0f0a1e;
        border: 1px solid rgba(0, 240, 255, 0.25);
        border-radius: 20px;
        padding: 2.5rem 2rem;
        box-shadow: 0 0 40px rgba(255, 0, 127, 0.15);">

        <!-- Başlık -->
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="font-size: 2.5rem; margin-bottom: 0.75rem;">💃</div>
            <h1 data-auth-i18n="title" style="
                color: #ffffff;
                font-size: 1.25rem;
                font-weight: 600;
                margin: 0 0 0.4rem;">
                Tango Koleksiyon
            </h1>
            <p data-auth-i18n="subtitle" style="color: rgba(255,255,255,0.4); font-size: 0.85rem; margin: 0;">
                Devam etmek için giriş yapın
            </p>
        </div>

        <!-- E-posta alanı -->
        <div style="margin-bottom: 1rem;">
            <label data-auth-i18n="email-label" style="
                display: block;
                color: rgba(255,255,255,0.55);
                font-size: 0.8rem;
                margin-bottom: 7px;">
                E-posta
            </label>
            <input
                id="login-email"
                data-auth-i18n="email-input"
                type="email"
                placeholder="ornek@email.com"
                autocomplete="email"
                style="
                    width: 100%;
                    box-sizing: border-box;
                    background: rgba(255,255,255,0.05);
                    border: 1px solid rgba(0,240,255,0.3);
                    border-radius: 10px;
                    padding: 12px 14px;
                    color: #ffffff;
                    font-size: 0.95rem;
                    font-family: 'Poppins', sans-serif;
                    outline: none;
                    transition: border-color 0.2s;"
                onfocus="this.style.borderColor='rgba(0,240,255,0.7)'"
                onblur="this.style.borderColor='rgba(0,240,255,0.3)'" />
        </div>

        <!-- Şifre alanı -->
        <div style="margin-bottom: 0.5rem;">
            <label data-auth-i18n="pass-label" style="
                display: block;
                color: rgba(255,255,255,0.55);
                font-size: 0.8rem;
                margin-bottom: 7px;">
                Şifre
            </label>
            <input
                id="login-password"
                data-auth-i18n="pass-input"
                type="password"
                placeholder="••••••••"
                autocomplete="current-password"
                style="
                    width: 100%;
                    box-sizing: border-box;
                    background: rgba(255,255,255,0.05);
                    border: 1px solid rgba(0,240,255,0.3);
                    border-radius: 10px;
                    padding: 12px 14px;
                    color: #ffffff;
                    font-size: 0.95rem;
                    font-family: 'Poppins', sans-serif;
                    outline: none;
                    transition: border-color 0.2s;"
                onfocus="this.style.borderColor='rgba(0,240,255,0.7)'"
                onblur="this.style.borderColor='rgba(0,240,255,0.3)'" />
        </div>

        <!-- Hata mesajı -->
        <p id="login-error" style="
            color: #ff6b6b;
            font-size: 0.82rem;
            min-height: 1.4rem;
            margin: 8px 0 16px;"></p>

        <!-- Giriş Yap butonu -->
        <button
            id="login-btn"
            data-auth-i18n="login-btn"
            style="
                width: 100%;
                padding: 13px;
                background: linear-gradient(135deg, #ff007f, #cc0066);
                border: none;
                border-radius: 10px;
                color: #ffffff;
                font-size: 1rem;
                font-weight: 600;
                font-family: 'Poppins', sans-serif;
                cursor: pointer;
                transition: opacity 0.2s, transform 0.1s;"
            onmouseover="this.style.opacity='0.88'"
            onmouseout="this.style.opacity='1'"
            onmousedown="this.style.transform='scale(0.98)'"
            onmouseup="this.style.transform='scale(1)'">
            Giriş Yap
        </button>

    </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
