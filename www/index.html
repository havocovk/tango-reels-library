<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Arjantin Tango Kombinasyon Koleksiyonu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/buttons.css">
    <link rel="stylesheet" href="styles/cards.css">
    <link rel="stylesheet" href="styles/forms.css">
    <link rel="stylesheet" href="styles/modals.css">
    <link rel="stylesheet" href="styles/stats-tagmanager.css">
    <link rel="stylesheet" href="styles/practice-session.css">
    <link rel="stylesheet" href="styles/playlists.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/6.6.2/fuse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
    <link rel="manifest" href="manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Service worker registered:', reg.scope))
            .catch(err => console.error('Service worker error:', err));
        });
      }
    </script>
</head>
<body>
<!-- ✅ YENİ (Adım 7.4): Ekran okuyucu kullanıcıları için içeriğe atla bağlantısı -->
<a href="#main-content" class="skip-link">Ana içeriğe geç</a>

<div class="bg-glow current-location-glow"></div>
<div class="secondary-glow bg-glow"></div>

<div class="app-container">
    <nav class="sidebar-glass">
        <div class="sidebar-header">
            <h2 id="sidebar-title"></h2>
            <button id="lang-toggle-btn" class="lang-btn">🇬🇧 EN</button>
        </div>
        <hr style="border-color: rgba(0, 240, 255, 0.2); margin: 15px 0;">
        <div class="menu-items">
            <button id="menu-library" class="menu-btn active">📚 Koleksiyon</button>
            <button id="menu-favorites" class="menu-btn">⭐ Pratik Listem</button>
            <button id="menu-stats" class="menu-btn">📊 İstatistikler</button>
            <button id="menu-add-video" class="menu-btn">➕ Yeni Video Ekle</button>
            <button id="menu-tag-manager" class="menu-btn">🏷️ Etiket Yönetimi</button>
        </div>

        <!-- Playlist bölümü — menü butonlarının hemen altına gelir -->
        <div id="playlist-section-container"></div>

    </nav>

    <main class="main-content-glass" id="main-content" aria-label="Ana içerik">
        <!-- Tüm view'lar ve modallar buraya yüklenecek -->
        <div id="dynamic-views"></div>
    </main>
</div>

<!-- Loading overlay -->
<div id="loading-overlay" class="loading-overlay d-none">
    <div class="spinner"></div>
    <div id="loading-text">İşlem yapılıyor...</div>
</div>

<!-- ✅ YENİ (Adım 7.1): Mobil Alt Navigasyon Barı
     Masaüstünde CSS ile tamamen gizlenir.
     Telefonda ekranın altına sabitlenir. -->
<nav class="bottom-nav" id="bottom-nav" aria-label="Alt navigasyon">
    <button class="bottom-nav-btn active" id="bn-library">
        <span class="bn-icon">📚</span>
        <span class="bn-label" data-i18n="menuLibrary">Koleksiyon</span>
    </button>
    <button class="bottom-nav-btn" id="bn-favorites">
        <span class="bn-icon">⭐</span>
        <span class="bn-label" data-i18n="menuFavorites">Pratik</span>
    </button>
    <button class="bottom-nav-btn" id="bn-stats">
        <span class="bn-icon">📊</span>
        <span class="bn-label" data-i18n="menuStats">İstatistik</span>
    </button>
    <button class="bottom-nav-btn" id="bn-add">
        <span class="bn-icon">➕</span>
        <span class="bn-label" data-i18n="menuAdd">Ekle</span>
    </button>
    <button class="bottom-nav-btn" id="bn-tags">
        <span class="bn-icon">🏷️</span>
        <span class="bn-label" data-i18n="menuTags">Etiketler</span>
    </button>
</nav>

<script type="module" src="app.js"></script>
</body>
</html>
